name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$(jq -r '.inputs.version // ""' "$GITHUB_EVENT_PATH")"
            prerelease="$(jq -r '.inputs.prerelease // "false"' "$GITHUB_EVENT_PATH")"
          else
            version="$GITHUB_REF_NAME"
            prerelease="false"
          fi

          case "$version" in
            v*) ;;
            *)
              echo "release version must start with v, got: $version" >&2
              exit 1
              ;;
          esac

          case "$version" in
            *[!A-Za-z0-9._-]*)
              echo "release version contains unsupported characters: $version" >&2
              exit 1
              ;;
          esac

          case "$prerelease" in
            true|false) ;;
            *)
              echo "prerelease must be true or false, got: $prerelease" >&2
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Build release package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_GOOS: ${{ matrix.goos }}
          RELEASE_GOARCH: ${{ matrix.goarch }}
        run: make release VERSION="$VERSION" RELEASE_GOOS="$RELEASE_GOOS" RELEASE_GOARCH="$RELEASE_GOARCH"

      - name: Verify release package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_GOOS: ${{ matrix.goos }}
          RELEASE_GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          archive_name="acorn_${VERSION}_${RELEASE_GOOS}_${RELEASE_GOARCH}.tar.gz"
          archive="dist/$archive_name"

          (cd dist && sha256sum -c "$archive_name.sha256")

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          tar -xzf "$archive" -C "$tmpdir"
          package_dir="$tmpdir/acorn_${VERSION}_${RELEASE_GOOS}_${RELEASE_GOARCH}"
          grep -qx "installer=install-release.sh" "$package_dir/RELEASE"
          grep -qx "skills_dir=skills" "$package_dir/RELEASE"
          test -f "$package_dir/skills/skill_creator/SKILL.md"
          test -f "$package_dir/skills/web_browser_research/SKILL.md"
          test -x "$package_dir/install-release.sh"
          grep -qx "ExecStart=/opt/acorn/acorn serve" "$package_dir/acorn.service"
          (cd "$package_dir" && sha256sum -c CHECKSUMS)

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: acorn-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 14
          path: |
            dist/acorn_${{ needs.metadata.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/acorn_${{ needs.metadata.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256

  mobile-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install openapi-generator-cli
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Verify generated mobile client
        run: cd mobile-kotlin && ./tool/generate_openapi_client.sh --check

      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          required=(
            ANDROID_RELEASE_KEYSTORE_BASE64
            ANDROID_RELEASE_KEYSTORE_PASSWORD
            ANDROID_RELEASE_KEY_ALIAS
            ANDROID_RELEASE_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::missing required Android signing secret: $name" >&2
              exit 1
            fi
          done

          keystore_path="mobile-kotlin/app/release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          cat > mobile-kotlin/app/key.properties <<EOF
          storePassword=$ANDROID_RELEASE_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_RELEASE_KEY_PASSWORD
          keyAlias=$ANDROID_RELEASE_KEY_ALIAS
          storeFile=release.jks
          storeType=pkcs12
          EOF

      - name: Build signed release APK
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        working-directory: mobile-kotlin
        shell: bash
        run: |
          build_name="${VERSION#v}"
          build_number="$GITHUB_RUN_NUMBER"

          # Update versionCode and versionName in build.gradle.kts
          sed -i "s/versionCode = 1/versionCode = $build_number/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$build_name\"/" app/build.gradle.kts

          ./gradlew assembleRelease

          mkdir -p ../dist
          apk_name="acorn_mobile_${VERSION}_android.apk"
          cp app/build/outputs/apk/release/app-release.apk "../dist/$apk_name"
          (cd ../dist && sha256sum "$apk_name" > "$apk_name.sha256")

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: acorn-mobile-android
          retention-days: 14
          path: |
            dist/acorn_mobile_${{ needs.metadata.outputs.version }}_android.apk
            dist/acorn_mobile_${{ needs.metadata.outputs.version }}_android.apk.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
      - mobile-android
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Add installer asset
        shell: bash
        run: |
          install -m 0755 scripts/install-release.sh dist/install-release.sh
          (cd dist && sha256sum install-release.sh > install-release.sh.sha256)

      - name: Verify downloaded artifacts
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -print | sort
          (cd dist && for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done)

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          for archive in dist/*.tar.gz; do
            [ -e "$archive" ] || continue
            rm -rf "$tmpdir"/*
            tar -xzf "$archive" -C "$tmpdir"
            package_dir="$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -f "$package_dir/skills/skill_creator/SKILL.md"
            test -f "$package_dir/skills/web_browser_research/SKILL.md"
            (cd "$package_dir" && sha256sum -c CHECKSUMS)
          done

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Automated Acorn self-hosted release packages.

          Assets:
          - install-release.sh (downloads and installs the latest release by default)
          - acorn_${VERSION}_linux_amd64.tar.gz (pure Go binary, no CGO)
          - acorn_${VERSION}_linux_arm64.tar.gz (pure Go binary, no CGO)
          - acorn_mobile_${VERSION}_android.apk (signed Kotlin/Compose mobile APK)
          - bundled native skills installed under ~/.acorn/skills by install-release.sh

          Packages are built with CGO_ENABLED=0 (pure Go cross-compile).
          Semantic search uses OpenAI embedding + SQLite vector storage.
          Android APK is built from mobile-kotlin/ with Kotlin + Jetpack Compose and signed from repository secrets.
          EOF

          create_args=("$VERSION" dist/* --title "$VERSION" --notes-file "$notes_file")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            create_args+=(--target "$GITHUB_SHA")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            create_args+=(--prerelease)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "${create_args[@]}"
          fi
