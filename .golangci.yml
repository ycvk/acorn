# golangci-lint v2 configuration for Acorn
# Philosophy: bug-focused and format-clean. This repo treats lint failures as
# real regressions, not a backlog of tolerated warnings.
version: "2"

linters:
  # standard set (errcheck, govet, ineffassign, staticcheck, unused) + extras
  enable:
    - bodyclose     # HTTP response body not closed
    - errname       # error naming convention (ErrXxx)
    - nilerr        # returning nil when err is non-nil
    - noctx         # HTTP request without context
    - rowserrcheck  # database rows.Err() not checked
    - sqlclosecheck # sql.Rows/Stmt not closed
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Fprintln
        - fmt.Println
        - fmt.Fprint
        - fmt.Print
        - fmt.Sprint
        - fmt.Sprintln
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments
        - -ST1003 # initialism naming
        - -ST1016 # receiver name consistency
        - -ST1020 # exported func comment form
        - -ST1021 # exported type comment form
        - -ST1022 # exported var comment form
        - -QF1008 # explicit embedded-field selectors are clearer here
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files get more leniency
      - path: _test\.go
        linters:
          - errcheck
          - noctx
          - rowserrcheck
          - sqlclosecheck
      # Commands are cancelled via process-group kill (tools.ConfigureCommand),
      # not exec.CommandContext, which would only kill the group leader.
      - linters: [noctx]
        text: "os/exec.Command must not be called"
      # One-shot schema bootstrap during Open; no caller context exists yet.
      - path: internal/(store/store_schema|memory/vector_index)\.go
        linters: [noctx]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
