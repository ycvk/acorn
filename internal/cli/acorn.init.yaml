# Acorn self-hosted starter config (created by `acorn init`).
#
# Quick start:
#   1. Set OPENAI_API_KEY in your environment (self-hosted systemd reads ~/.acorn/acorn.env).
#   2. Run `acorn doctor`   — should report `Ready: ready`.
#   3. Run `acorn smoke "hello, are you working?"` — runs a real task end-to-end.
#   4. Run `acorn serve` to start the /v1 API, then `acorn pair --qr` to pair a phone.

runtime:
  storage_dir: ~/.acorn
  run_timeout_seconds: 900

providers:
  - name: primary
    model: gpt-4o
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout_seconds: 30
    temperature: 0.1
    max_completion_tokens: 2048
    enabled: true

context:
  window_tokens: 200000
  compact_margin_tokens: 13000
  preserve_recent_turns: 3
  summary_max_tokens: 2048

web:
  listen_addr: 127.0.0.1:8080

agent:
  name: coordinator
  description: Self-hosted operator agent for files, shell tasks, and external MCP tools.
  max_iterations: 90
  system_prompt: |
    You are Acorn's coordinator agent running in a self-hosted backend.

    Rules:
    - Treat the configured workspace as the operator workspace.
    - Prefer read_file, list_files, search_text, inspect_git_status, and inspect_git_diff before mutation or shell execution.
    - Use run_command only when native tools cannot answer or execute the task directly.
    - Never pretend a tool, MCP provider, or command succeeded when it did not run.
    - Keep answers concrete and short.

tools:
  run_command:
    default_timeout: 30
    work_dir: ~/.acorn/workspace
    env_whitelist:
      - PATH
      - HOME
      - GIT_EDITOR
  workspace:
    root_dir: ~/.acorn/workspace
  mutation:
    root_dir: ~/.acorn/workspace
    denylist: []

mcp:
  providers: []

memory:
  search:
    memory_context_token_budget: 2000
  # Semantic memory recall is an OPTIONAL enhancement. It is OFF by default:
  # runs proceed with no recalled memory (the run hot-path degrades to empty).
  # To enable it, uncomment embedding.model + embedding.base_url below — then
  # embedding.api_key/dimensions/timeout_seconds/batch_size are validated.
  semantic:
    bleve:
      path: ""               # Empty resolves to runtime.storage_dir/bleve-semantic
      index_name: memory_records
    embedding:
      provider: openai_compatible
      # model: text-embedding-3-small
      # base_url: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY}  # Independent embedding key; may equal the chat OPENAI_API_KEY
      dimensions: 1536
      timeout_seconds: 30
      batch_size: 64
