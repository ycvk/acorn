# Acorn self-hosted starter config (created by `acorn init`).
#
# Quick start:
#   1. Set OPENAI_API_KEY in your environment (self-hosted systemd reads ~/.acorn/acorn.env).
#   2. Run `acorn doctor`   — should report `Ready: ready`.
#   3. Run `acorn smoke "hello, are you working?"` — runs a real task end-to-end.
#   4. Run `acorn serve` to start the /v1 API, then `acorn pair --qr` to pair a phone.

runtime:
  storage_dir: ~/.acorn
  run_timeout_seconds: 900

providers:
  - name: primary
    model: gpt-4o
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout_seconds: 30
    temperature: 0.1
    max_completion_tokens: 2048
    enabled: true

approval:
  # Tool-name glob patterns whose calls pause for owner approval on the phone.
  require:
    - browser
    - "mcp__*"

owner:
  # IANA timezone used to show times and to read wake times given in local time,
  # e.g. Asia/Shanghai.
  timezone: UTC

presence:
  # Token cap for the working-memory block shown to the model before each call.
  max_tokens: 4000

wake:
  # Commitment wakes allowed per local day; 0 turns autonomous wakes off.
  daily_limit: 20

notify:
  max_per_hour: 6
  # Notifications inside this window wait until it ends (owner timezone).
  quiet_hours:
    start: "23:00"
    end: "08:00"
  fcm:
    # Firebase service account key file; empty disables push notifications.
    service_account_file: ""

context:
  window_tokens: 200000
  compact_margin_tokens: 13000

web:
  listen_addr: 127.0.0.1:8080

agent:
  name: coordinator
  description: Self-hosted personal agent that works on its owner's behalf and asks for approval before sensitive actions.
  max_iterations: 90
  system_prompt: |
    You are Acorn, the owner's self-hosted personal agent. The owner reaches you
    from their phone; scheduled triggers also wake you.

    Tool discipline:
    - Call only the tools registered in this run; use tool_search to load the web
      tools (web_search, web_fetch, browser) when you need them.
    - Some tools pause for the owner's approval on their phone. Explain what you
      are about to do before calling them.
    - When external MCP tools are available, prefer them over inventing capabilities.
    - Never pretend a tool or MCP provider succeeded when it did not run.
    - Keep answers concrete and short.

tools:
  # Holds the seed skills (skills/) and workspace skills (.acorn/skills/workspace).
  workspace:
    root_dir: ~/.acorn/workspace

mcp:
  providers: []

memory:
  search:
    memory_context_token_budget: 8000
  embedding:
    enabled: false              # Opt-in semantic retrieval. When true, memory records are embedded via the provider's /v1/embeddings endpoint and searched with sqlite-vec KNN + keyword fusion (RRF). When false, search is keyword-only.
    model: text-embedding-3-small # OpenAI-compatible embedding model (reuses provider base_url + api_key)
    dimensions: 1536             # Must match the embedding model's output dimension
