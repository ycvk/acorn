# Acorn self-hosted starter config (created by `acorn init`).
#
# This file holds what is set once at deployment: model and service keys,
# addresses, and limits other services on the host share. Your time zone,
# the times of the morning briefing and the reflections, push quiet hours,
# daily budgets and approval rules are settings: change them in the app's
# settings or with `acorn settings set`.
#
# Quick start:
#   1. Set OPENAI_API_KEY and VOYAGE_API_KEY in your environment (self-hosted systemd reads ~/.acorn/acorn.env).
#   2. Run `acorn doctor`   — should report `Ready: ready`.
#   3. Run `acorn smoke "hello, are you working?"` — runs a real task end-to-end.
#   4. Run `acorn serve` to start the /v1 API, then `acorn pair --qr` to pair a phone.

runtime:
  storage_dir: ~/.acorn

providers:
  # A model the model table does not know also needs context_window_tokens.
  - name: primary
    api: responses
    model: gpt-6-astra
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout_seconds: 0
    idle_timeout_seconds: 300
    max_output_tokens: 128000
    enabled: true

review:
  # TypeSafe's Jev judges shell commands, browser actions and MCP calls no
  # approval rule settles; those with consequences outside the workstation
  # (paying, sending, deleting, changing settings) pause for your approval.
  # Empty turns it off.
  api_key: ${TYPESAFE_API_KEY}
  model: jev-preview
  timeout_seconds: 20

memory:
  embedding:
    base_url: https://api.voyageai.com/v1
    api_key: ${VOYAGE_API_KEY}
    model: voyage-4
    dimensions: 1024

notify:
  fcm:
    # Firebase service account key file; empty disables push notifications.
    service_account_file: ""

watch:
  # Your RSSHub, for rsshub:/route watches (see the onboarding guide); its
  # address is reached even on loopback, such as http://127.0.0.1:1200.
  rsshub_base_url: ""
  # Optional GitHub token for a higher API rate limit, e.g. ${GITHUB_TOKEN}.
  github_token: ""

backup:
  # Where `acorn backup` writes snapshots; empty turns backups off.
  dir: ""
  keep: 14

workstation:
  # The agent's own Linux computer, served by acorn-workstation.service.
  # Empty url turns the shell and files tools off.
  url: ""
  token: ${ACORN_WORKSTATION_TOKEN}

files:
  # Size caps, in MiB, for a file you send the agent from the app and for one
  # it sends you from its workstation. A reverse proxy in front of Acorn needs
  # a request body limit above max_upload_mib.
  max_upload_mib: 50
  max_send_mib: 100

web:
  listen_addr: 127.0.0.1:8080

mcp:
  providers: []
