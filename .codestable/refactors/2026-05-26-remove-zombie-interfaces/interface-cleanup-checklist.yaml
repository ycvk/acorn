phases:
  - name: Phase 1 - 删除 stream 副本
    status: completed
    steps:
      - action: 删除 internal/runtime/stream/ 目录
        verify: go build ./...
        status: completed
      - action: 删除 internal/runtime/alias_stream.go
        verify: go build ./...
        status: completed
      - action: 修改 internal/runtime/plan.go 导入路径
        verify: go build ./...
        status: completed
      - action: 迁移 runtime/app/web 调用方直接使用 internal/stream
        verify: rg 'runtime\.Stream|runtime\.RunStartedPayload|runtime\.StreamKind' internal 无匹配
        status: completed

  - name: Phase 2 - 统一类型定义
    status: pending
    steps:
      - action: 删除 internal/runtime/executor.go 中的 Result 定义，使用 runbase.Result
        verify: go build ./internal/runtime/...
      - action: 删除 internal/runtime/trace.go 中的 TraceSummary 定义，使用 runbase.TraceSummary
        verify: go build ./internal/runtime/...
      - action: 删除 internal/stream/api.go 中的 Result/TraceSummary/SessionState，使用 runbase 类型
        verify: go build ./internal/stream/...
      - action: 删除 internal/runtime/api/api.go 中的 SessionState，使用 runbase.SessionState
        verify: go build ./internal/runtime/...

  - name: Phase 3 - 删除僵尸接口
    status: pending
    steps:
      - action: 删除 store_ports.go 中的 9 个接口，让 service 直接使用 sqlite.Store
        verify: go build ./internal/app/...
      - action: 删除 capability_service.go 中的 3 个接口
        verify: go build ./internal/app/...
      - action: 删除 trace_service.go 中的 2 个接口
        verify: go build ./internal/app/...
      - action: 删除其他单文件接口（ChatStore、stableSkillScanner、runtimePlanRecordStore、executorHandle、PendingActionCreateStore、inboxCapabilityService）
        verify: go build ./internal/app/...
      - action: 运行 internal/app/ 全部测试
        verify: go test ./internal/app/...

  - name: Phase 4 - 合并 Decision 引擎
    status: pending
    steps:
      - action: 创建 internal/runtime/decision_types.go，移动 decision 核心类型
        verify: go build ./internal/runtime/...
      - action: 创建 internal/runtime/decision.go，移动 decision 核心逻辑
        verify: go build ./internal/runtime/...
      - action: 更新所有引用 internal/decision/ 的文件
        verify: go build ./...
      - action: 删除 internal/decision/ 目录
        verify: go build ./...
      - action: 运行 runtime 测试
        verify: go test ./internal/runtime/...

  - name: 全量验证
    status: pending
    steps:
      - action: go test ./...
        verify: 全部通过
      - action: make format-check
        verify: 通过
      - action: make lint
        verify: 通过
