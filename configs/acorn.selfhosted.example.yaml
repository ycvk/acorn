runtime:
  storage_dir: ~/.acorn
  run_timeout_seconds: 900

providers:
  - name: primary
    model: gpt-4o
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout_seconds: 30
    temperature: 0.1
    max_completion_tokens: 2048
    enabled: true

context:
  window_tokens: 200000
  compact_margin_tokens: 13000
  preserve_recent_turns: 3
  mask_after_turns: 2

web:
  listen_addr: 127.0.0.1:8080
  # Optional CORS origins for trusted browser tooling behind a reverse proxy.
  # Mobile clients do not use browser CORS, and the React/Vite frontend has been removed.
  # allowed_origins:
  #   - https://acorn.example.com

web_access:
  user_agent: "Acorn/0.x (+https://github.com/ycvk/acorn)"
  timeout_seconds: 20
  max_response_bytes: 10485760
  allow_private_networks: false
  search:
    provider: tavily
    api_key: ${TAVILY_API_KEY}
    timeout_seconds: 10
    max_results: 10

browser:
  executable_path: ""        # Set to /usr/bin/chromium to enable browser tool calls.
  headless: true
  default_timeout_seconds: 20

agent:
  name: coordinator
  description: Self-hosted ambient agent that wakes on external events, acts on the owner's behalf, and escalates high-risk actions for approval.
  max_iterations: 90
  system_prompt: |
    You are Acorn, the operator's self-hosted ambient agent. You wake when external
    events arrive (webhooks, triggers) or when the operator sends a message from
    their phone. The ambient agent loop is injected below — follow it.

    Tool discipline:
    - Orient with read-only tools first: read_file, list_files, search_text,
      inspect_git_status, inspect_git_diff, worldstate_load.
    - Use run_command only when native tools cannot answer or execute the task.
    - Never pretend a tool, MCP provider, or command succeeded when it did not run.
    - Keep answers concrete and short.

tools:
  run_command:
    default_timeout: 30
    work_dir: /srv/acorn/workspace
    env_whitelist:
      - PATH
      - HOME
      - GIT_EDITOR
  workspace:
    root_dir: /srv/acorn/workspace
  mutation:
    root_dir: /srv/acorn/workspace
    denylist: []

mcp:
  providers: []

memory:
  search:
    memory_context_token_budget: 8000
  embedding:
    enabled: false              # Opt-in semantic retrieval. When true, memory records are embedded via the provider's /v1/embeddings endpoint and searched with sqlite-vec KNN + keyword fusion (RRF). When false, search is keyword-only.
    model: text-embedding-3-small # OpenAI-compatible embedding model (reuses provider base_url + api_key)
    dimensions: 1536             # Must match the embedding model's output dimension
  review:
    review_interval: 5           # Every N completed runs, trigger one LLM call to distill durable facts (0 disables).
    # review_model: gpt-4o-mini  # Optional: use a cheaper model for the periodic review LLM call.
  active:
    char_limit: 2200             # Character budget for the Active Memory snapshot (verified user facts always injected, ~800 tokens).

# Triggers let the agent wake itself from external events (ambient mode).
triggers:
  debounce_millis: 2000
  daily_quota: 0 # Max trigger-started runs per UTC day (0 = unlimited)
  webhooks: []
  crons: []
  # - id: morning_digest
  #   schedule: "0 9 * * *"
  #   prompt: "Morning digest."
  # - id: deploy_webhook
  #   secret: "${DEPLOY_WEBHOOK_SECRET}"
  #   prompt: "A deployment webhook fired. Payload: {{payload}}"

