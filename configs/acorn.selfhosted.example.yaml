runtime:
  storage_dir: ~/.acorn
  run_timeout_seconds: 0

providers:
  - name: primary
    api: responses
    model: gpt-6-astra
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout_seconds: 0
    idle_timeout_seconds: 300
    max_output_tokens: 128000
    enabled: true

approval:
  # Tool-name glob patterns whose calls pause for owner approval on the phone.
  require:
    - browser
    - "mcp__*"

owner:
  # IANA timezone used to show times and to read wake times given in local time,
  # e.g. Asia/Shanghai.
  timezone: UTC

presence:
  # Token cap for the working-memory block shown to the model before each call.
  max_tokens: 4000

wake:
  # Commitment wakes allowed per local day; 0 turns autonomous wakes off.
  daily_limit: 20
  daily_tokens: 0       # Autonomous tokens per local day; 0 leaves tokens unlimited.
thinking:
  night_at: "03:00"          # Owner timezone; empty disables night reflection.
  wander_at: []              # Up to six HH:MM slots for idle thought.

notify:
  max_per_hour: 6
  # Notifications inside this window wait until it ends (owner timezone).
  quiet_hours:
    start: "23:00"
    end: "08:00"
  fcm:
    # Firebase service account key file; empty disables push notifications.
    service_account_file: ""

knowledge:
  # Markdown notes the agent writes, also a git repository; empty means
  # {storage_dir}/knowledge. Point it at an existing Obsidian vault if you like.
  dir: ""

watch:
  # Your RSSHub, for rsshub:/route watches (see the onboarding guide).
  rsshub_base_url: ""
  # Optional GitHub token for a higher API rate limit, e.g. ${GITHUB_TOKEN}.
  github_token: ""
  max_checks_per_tick: 5

briefing:
  # Morning briefing time in owner.timezone; empty turns it off.
  at: "08:00"

context:
  window_tokens: 1050000
  compact_margin_tokens: 32000
  mask_after_turns: 8

web:
  listen_addr: 127.0.0.1:8080
  # Optional CORS origins for trusted browser tooling behind a reverse proxy.
  # Mobile clients do not use browser CORS, and the React/Vite frontend has been removed.
  # allowed_origins:
  #   - https://acorn.example.com

web_access:
  user_agent: "Acorn/0.x (+https://github.com/ycvk/acorn)"
  timeout_seconds: 20
  max_response_bytes: 10485760
  allow_private_networks: false
  search:
    provider: tavily
    api_key: ${TAVILY_API_KEY}
    timeout_seconds: 10
    max_results: 10

browser:
  executable_path: ""        # Set to /usr/bin/chromium to enable browser tool calls.
  headless: true
  default_timeout_seconds: 20

agent:
  name: coordinator
  description: Self-hosted personal agent that works on its owner's behalf and asks for approval before sensitive actions.
  max_iterations: 100

tools:
  # Holds the seed skills (skills/) and workspace skills (.acorn/skills/workspace).
  workspace:
    root_dir: /srv/acorn/workspace

mcp:
  providers: []

