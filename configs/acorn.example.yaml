runtime:
# storage_dir: ~/.acorn

# Exactly one LLM provider must have enabled: true.
providers:
  - name: primary
    model: gpt-4o
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout_seconds: 30
    temperature: 0.1
    max_completion_tokens: 2048
    # reasoning_effort: medium     # low | medium | high — only for reasoning models (o1, o3, etc.)
    # extra_fields:                # Provider-specific fields added to the API request body top-level
    #   thinking:                  # Claude 3.7 Sonnet thinking mode (nested object, not boolean)
    #     type: enabled
    #     budget_tokens: 2048
    enabled: true

context:
  window_tokens: 200000
  compact_margin_tokens: 13000
  preserve_recent_turns: 3
  mask_after_turns: 2

web:
  listen_addr: 0.0.0.0:8080
  # Optional CORS origins for trusted browser tooling when deploying behind a
  # reverse proxy. Native mobile clients do not use browser CORS, and the
  # React/Vite frontend has been removed.
  # allowed_origins:
  #   - https://acorn.example.com

web_access:
  user_agent: "Acorn/0.x (+https://github.com/ycvk/acorn)"
  timeout_seconds: 20
  max_response_bytes: 10485760
  allow_private_networks: false
  search:
    provider: tavily
    api_key: ${TAVILY_API_KEY}
    timeout_seconds: 10
    max_results: 10

browser:
  executable_path: "" # Set to /usr/bin/chromium to enable browser tool calls.
  headless: true
  default_timeout_seconds: 20

agent:
  name: coordinator
  description: Self-hosted ambient agent that wakes on external events, acts on the owner's behalf, and escalates high-risk actions for approval.
  max_iterations: 90
  system_prompt: |
    You are Acorn, the operator's self-hosted ambient agent. You wake when external
    events arrive (webhooks, triggers) or when the operator sends a message from
    their phone. The ambient agent loop is injected below — follow it.

    Tool discipline:
    - Orient with read-only tools first: read_file, list_files, search_text,
      inspect_git_status, inspect_git_diff, worldstate_load.
    - Use run_command only when native tools cannot answer or execute the task.
    - When external MCP tools are available, prefer them over inventing capabilities.
    - Never pretend a tool, MCP provider, or command succeeded when it did not run.
    - Call only the tools actually registered in this run.
    - If a shell command should pause for inspection, call run_command with
      pause_before_exec=true so the runtime interrupts explicitly.
    - Keep answers concrete and short.

tools:
  run_command:
    # disabled: true              # Set to true to disable run_command (rarely needed)
    default_timeout: 30
    work_dir: ..
    env_whitelist: []
    # env_whitelist:
    #   - PATH
    #   - HOME
    #   - GIT_EDITOR
  workspace:
    root_dir: ..
  mutation:
    # disabled: true              # Set to true to disable native mutation tools (rarely needed)
    root_dir: ..
    # Denylist: path components that block writes even under root.
    # When empty, the default denylist is used (.ssh, .aws, .gnupg, etc.).
    denylist: []

mcp:
  providers:
    # Example: Remote MCP server over SSE (path-prefix not allowed for SSE).
    # - name: remote_sse
    #   enabled: false
    #   transport: sse
    #   url: http://localhost:8080/sse
    #   timeout_seconds: 30
    #   startup_timeout_seconds: 60
    # Example: Remote MCP server over Streamable HTTP (supports path-prefix).
    # - name: remote_streamable
    #   enabled: false
    #   transport: streamable_http
    #   url: http://localhost:8080/proxy/mcp
    #   timeout_seconds: 30
    #   startup_timeout_seconds: 60
    #   # Auth configuration for HTTP-based providers:
    #   # auth:
    #   #   type: oauth          # "none" (default), "oauth", or "api_key"
    #   #   client_id: "my-client"
    #   #   scopes:
    #   #     - read
    #   #     - write
    # tool_safety: read_only         # read_only | serial

memory:
  search:
    memory_context_token_budget: 8000
  embedding:
    enabled: false              # Opt-in semantic retrieval. When true, memory records are embedded via the provider's /v1/embeddings endpoint and searched with sqlite-vec KNN + keyword fusion (RRF). When false, search is keyword-only.
    model: text-embedding-3-small # OpenAI-compatible embedding model (reuses provider base_url + api_key)
    dimensions: 1536             # Must match the embedding model's output dimension # Soft token budget for file-backed memory context

# Triggers let the agent wake itself from external events (ambient mode).
# Webhook triggers receive HTTP POST at /v1/triggers/{id}, verified via
# HMAC-SHA256 (X-Acorn-Signature header). See ADR-0001.
triggers:
  debounce_millis: 2000
  daily_quota: 0 # Max trigger-started runs per UTC day (0 = unlimited). Protects against runaway webhooks. # Coalesce rapid webhook fires into one run (0 disables)
  webhooks:
    - id: deploy_webhook
      secret: "${DEPLOY_WEBHOOK_SECRET}"
      prompt: "A deployment webhook fired. Payload: {{payload}}"
  crons:
    - id: morning_digest
      schedule: "0 9 * * *" # Daily at 09:00 UTC
      prompt: "Generate a morning digest: check worldstate, summarize what happened overnight, and report anything that needs my attention."
