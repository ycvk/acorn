runtime:
# storage_dir: ~/.acorn

# Exactly one LLM provider must have enabled: true.
providers:
  - name: primary
    model: gpt-4o
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout_seconds: 30
    temperature: 0.1
    max_completion_tokens: 2048
    # reasoning_effort: medium     # low | medium | high — only for reasoning models (o1, o3, etc.)
    # extra_fields:                # Provider-specific fields added to the API request body top-level
    #   thinking:                  # Claude 3.7 Sonnet thinking mode (nested object, not boolean)
    #     type: enabled
    #     budget_tokens: 2048
    enabled: true

approval:
  # Tool-name glob patterns whose calls pause for owner approval on the phone.
  require:
    - browser
    - "mcp__*"

owner:
  # IANA timezone used to show times and to read wake times given in local time,
  # e.g. Asia/Shanghai.
  timezone: UTC

presence:
  # Token cap for the working-memory block shown to the model before each call.
  max_tokens: 4000

wake:
  # Commitment wakes allowed per local day; 0 turns autonomous wakes off.
  daily_limit: 20

notify:
  max_per_hour: 6
  # Notifications inside this window wait until it ends (owner timezone).
  quiet_hours:
    start: "23:00"
    end: "08:00"
  fcm:
    # Firebase service account key file; empty disables push notifications.
    service_account_file: ""

context:
  window_tokens: 200000
  compact_margin_tokens: 13000
  mask_after_turns: 2

web:
  listen_addr: 0.0.0.0:8080
  # Optional CORS origins for trusted browser tooling when deploying behind a
  # reverse proxy. Native mobile clients do not use browser CORS, and the
  # React/Vite frontend has been removed.
  # allowed_origins:
  #   - https://acorn.example.com

web_access:
  user_agent: "Acorn/0.x (+https://github.com/ycvk/acorn)"
  timeout_seconds: 20
  max_response_bytes: 10485760
  allow_private_networks: false
  search:
    provider: tavily
    api_key: ${TAVILY_API_KEY}
    timeout_seconds: 10
    max_results: 10

browser:
  executable_path: "" # Set to /usr/bin/chromium to enable browser tool calls.
  headless: true
  default_timeout_seconds: 20

agent:
  name: coordinator
  description: Self-hosted personal agent that works on its owner's behalf and asks for approval before sensitive actions.
  max_iterations: 90

tools:
  # Holds the seed skills (skills/) and workspace skills (.acorn/skills/workspace).
  workspace:
    root_dir: ..

mcp:
  providers:
    # Example: Remote MCP server over SSE (path-prefix not allowed for SSE).
    # - name: remote_sse
    #   enabled: false
    #   transport: sse
    #   url: http://localhost:8080/sse
    #   timeout_seconds: 30
    #   startup_timeout_seconds: 60
    # Example: Remote MCP server over Streamable HTTP (supports path-prefix).
    # - name: remote_streamable
    #   enabled: false
    #   transport: streamable_http
    #   url: http://localhost:8080/proxy/mcp
    #   timeout_seconds: 30
    #   startup_timeout_seconds: 60
    #   # Auth configuration for HTTP-based providers:
    #   # auth:
    #   #   type: oauth          # "none" (default), "oauth", or "api_key"
    #   #   client_id: "my-client"
    #   #   scopes:
    #   #     - read
    #   #     - write

memory:
  search:
    memory_context_token_budget: 8000
  embedding:
    enabled: false              # Opt-in semantic retrieval. When true, memory records are embedded via the provider's /v1/embeddings endpoint and searched with sqlite-vec KNN + keyword fusion (RRF). When false, search is keyword-only.
    model: text-embedding-3-small # OpenAI-compatible embedding model (reuses provider base_url + api_key)
    dimensions: 1536             # Must match the embedding model's output dimension # Soft token budget for file-backed memory context
  review:
    review_interval: 5           # Every N completed runs, trigger one LLM call to distill durable facts (0 disables). Uses the primary provider unless review_model is set.
    # review_model: gpt-4o-mini  # Optional: use a cheaper model for the periodic review LLM call.
  active:
    char_limit: 2200             # Character budget for the Active Memory snapshot (verified user facts always injected into the system prompt, ~800 tokens).
