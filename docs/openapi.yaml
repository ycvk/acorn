      additionalProperties: false
      properties:
        title:
          type: string

    UpdateThreadRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string

    MessageContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MessagePart'

    MessagePart:
      oneOf:
        - $ref: '#/components/schemas/TextMessagePart'
        - $ref: '#/components/schemas/ReasoningMessagePart'
        - $ref: '#/components/schemas/WorkStatusMessagePart'
        - $ref: '#/components/schemas/DecisionMessagePart'
        - $ref: '#/components/schemas/ResultMessagePart'
        - $ref: '#/components/schemas/DisclosureMessagePart'
        - $ref: '#/components/schemas/TechnicalDetailLinkMessagePart'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextMessagePart'
          reasoning: '#/components/schemas/ReasoningMessagePart'
          work_status: '#/components/schemas/WorkStatusMessagePart'
          decision: '#/components/schemas/DecisionMessagePart'
          result: '#/components/schemas/ResultMessagePart'
          disclosure: '#/components/schemas/DisclosureMessagePart'
          technical_detail_link: '#/components/schemas/TechnicalDetailLinkMessagePart'

    TextMessagePart:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          const: text
        text:
          type: string

    ReasoningMessagePart:
      type: object
      additionalProperties: false
      required: [kind, reasoning]
      properties:
        kind:
          type: string
          const: reasoning
        reasoning:
          type: string

    WorkStatusMessagePart:
      type: object
      additionalProperties: false
      required: [kind, status, title, summary]
      properties:
        kind:
          type: string
          const: work_status
        status:
          type: string
          enum: [working, interrupted, failed]
        title:
          type: string
        summary:
          type: string
        detail_run_id:
          type: string
        action:
          $ref: '#/components/schemas/MessageAction'

    MessageAction:
      type: object
      additionalProperties: false
      required: [kind, run_id, label]
      properties:
        kind:
          type: string
          enum: [resume_run]
        run_id:
          type: string
        label:
          type: string

    DecisionMessagePart:
      type: object
      additionalProperties: false
      required: [kind, decision_id, question]
      properties:
        kind:
          type: string
          const: decision
        decision_id:
          type: string
        question:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, resolved]
        selected_option_id:
          type: string
        answer:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/DecisionOption'

    DecisionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string

    DecidePendingActionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accept, decline, answer]
        selected_option_id:
          type: string
        answer:
          type: string

    PendingActionDecision:
      type: object
      additionalProperties: false
      required: [action_id, run_id, status, decision]
      properties:
        action_id:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum: [approved, rejected]
        decision:
          type: string
          enum: [accept, decline, answer]
        selected_option_id:
          type: string
        answer:
          type: string
        decided_at:
          type: string
          format: date-time

    ResultMessagePart:
      type: object
      additionalProperties: false
      required: [kind, title, changed, verified, risks]
      properties:
        kind:
          type: string
          const: result
        title:
          type: string
        changed:
          type: array
          items:
            type: string
        verified:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        detail_run_id:
          type: string

    DisclosureMessagePart:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          const: disclosure
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DisclosureItem'

    DisclosureItem:
      type: object
      additionalProperties: false
      required: [kind, label, tone]
      properties:
        kind:
          type: string
          enum: [memory, skill]
        label:
          type: string
        detail:
          type: string
        tone:
          type: string
          enum: [memory, skill, procedure, neutral, warning]
        skill_id:
          type: string

    TechnicalDetailLinkMessagePart:
      type: object
      additionalProperties: false
      required: [kind, run_id, label]
      properties:
        kind:
          type: string
          const: technical_detail_link
        run_id:
          type: string
        detail_run_id:
          type: string
        label:
          type: string

    Message:
      type: object
      additionalProperties: false
      required: [id, thread_id, role, content, created_at]
      properties:
        id:
          type: string
        thread_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          $ref: '#/components/schemas/MessageContent'
        created_at:
          type: string
          format: date-time
        run_id:
          type: string

    MessageListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          $ref: '#/components/schemas/MessageContent'

    CreateRunRequest:
      type: object
      additionalProperties: false
      properties:
        skill_id:
          type: string
        mode:
          type: string
          enum: [direct_response, plan_execute]

    Run:
      type: object
      additionalProperties: false
      required: [id, thread_id, status, mode, created_at]
      properties:
        id:
          type: string
        thread_id:
          type: string
        status:
          type: string
          enum: [running, completed, interrupted, failed]
        mode:
          type: string
          enum: [direct, agent, plan_execute]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    RunEvent:
      oneOf:
        - $ref: '#/components/schemas/ClientRunStartedEvent'
        - $ref: '#/components/schemas/ClientAssistantDeltaEvent'
        - $ref: '#/components/schemas/ClientAgentMessageEvent'
        - $ref: '#/components/schemas/ClientRunCompletedEvent'
        - $ref: '#/components/schemas/ClientRunFailedEvent'
        - $ref: '#/components/schemas/ClientRunInterruptedEvent'
        - $ref: '#/components/schemas/ClientRunResumeRequestedEvent'
        - $ref: '#/components/schemas/ClientElicitationPendingEvent'
        - $ref: '#/components/schemas/ClientElicitationDecidedEvent'
        - $ref: '#/components/schemas/ClientOperatorQuestionPendingEvent'
        - $ref: '#/components/schemas/ClientOperatorQuestionDecidedEvent'
        - $ref: '#/components/schemas/ClientDecisionBlockedEvent'
      discriminator:
        propertyName: type
        mapping:
          run.started: '#/components/schemas/ClientRunStartedEvent'
          assistant.delta: '#/components/schemas/ClientAssistantDeltaEvent'
          agent.message: '#/components/schemas/ClientAgentMessageEvent'
          run.completed: '#/components/schemas/ClientRunCompletedEvent'
          run.failed: '#/components/schemas/ClientRunFailedEvent'
          run.interrupted: '#/components/schemas/ClientRunInterruptedEvent'
          run.resume_requested: '#/components/schemas/ClientRunResumeRequestedEvent'
          elicitation.pending: '#/components/schemas/ClientElicitationPendingEvent'
          elicitation.decided: '#/components/schemas/ClientElicitationDecidedEvent'
          operator_question.pending: '#/components/schemas/ClientOperatorQuestionPendingEvent'
          operator_question.decided: '#/components/schemas/ClientOperatorQuestionDecidedEvent'
          decision_blocked: '#/components/schemas/ClientDecisionBlockedEvent'

    RunEventBase:
      type: object
      additionalProperties: false
      required: [event_id, run_id, seq, ts, type]
      properties:
        event_id:
          type: string
        run_id:
          type: string
        seq:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        type:
          type: string

    ClientRunStartedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.started
            data:
              $ref: '#/components/schemas/RunStartedData'

    ClientAssistantDeltaEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: assistant.delta
            data:
              $ref: '#/components/schemas/AssistantDeltaData'

    ClientAgentMessageEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: agent.message
            data:
              $ref: '#/components/schemas/AgentMessageData'

    ClientRunCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.completed
            data:
              $ref: '#/components/schemas/RunCompletedData'

    ClientRunFailedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.failed
            data:
              $ref: '#/components/schemas/RunFailedData'

    ClientRunInterruptedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.interrupted
            data:
              $ref: '#/components/schemas/RunInterruptedData'

    ClientRunResumeRequestedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.resume_requested
            data:
              $ref: '#/components/schemas/RunResumeRequestedData'

    ClientElicitationPendingEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: elicitation.pending
            data:
              $ref: '#/components/schemas/ElicitationData'

    ClientElicitationDecidedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: elicitation.decided
            data:
              $ref: '#/components/schemas/ElicitationData'

    ClientOperatorQuestionPendingEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: operator_question.pending
            data:
              $ref: '#/components/schemas/OperatorQuestionData'

    ClientOperatorQuestionDecidedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: operator_question.decided
            data:
              $ref: '#/components/schemas/OperatorQuestionData'

    ClientDecisionBlockedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: decision_blocked
            data:
              $ref: '#/components/schemas/DecisionBlockedData'

    RunStartedData:
      type: object
      additionalProperties: false
      properties:
        input:
          type: string

    AssistantDeltaData:
      type: object
      additionalProperties: false
      required: [assistant_delta]
      properties:
        assistant_delta:
          $ref: '#/components/schemas/StreamAssistantDelta'

    AgentMessageData:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          $ref: '#/components/schemas/StreamMessage'

    RunCompletedData:
      type: object
      additionalProperties: false
      properties:
        message:
          $ref: '#/components/schemas/StreamMessage'

    RunFailedData:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string

    RunInterruptedData:
      type: object
      additionalProperties: false
      properties:
        interrupt:
          $ref: '#/components/schemas/StreamInterrupt'

    RunResumeRequestedData:
      type: object
      additionalProperties: false
      properties:
        targets:
          type: object
          additionalProperties: true

    ElicitationData:
      type: object
      additionalProperties: false
      required: [action_id]
      properties:
        action_id:
          type: string
        message:
          type: string
        requested_schema:
          description: MCP elicitation requested schema

    OperatorQuestionData:
      type: object
      additionalProperties: false
      required: [action_id]
      properties:
        action_id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/PendingActionOption'
        allow_freeform:
          type: boolean
        decision:
          type: string
          enum: [answer, decline]
        selected_option_id:
          type: string
        answer:
          type: string

    DecisionBlockedData:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
        intent:
          type: string
        selected_skill_id:
          type: string
        decision_reason:
          type: string
        decision_profile_hash:
          type: string
        explicit_skill_id:
          type: string

    RunDetail:
      type: object
      additionalProperties: false
      required: [run, thread, events, artifacts, trace]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        thread:
          $ref: '#/components/schemas/Thread'
        events:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/RunArtifact'
        trace:
          oneOf:
            - $ref: '#/components/schemas/TraceSummary'
            - type: 'null'

    TraceSummary:
      type: object
      additionalProperties: false
      required: [item_count]
      properties:
        item_count:
          type: integer
        last_kind:
          type: string
        assistant_message_count:
          type: integer
        assistant_delta_count:
          type: integer
        assistant_delta_message_count:
          type: integer
        assistant_delta_char_count:
          type: integer
        tool_call_count:
          type: integer
        decision_event_count:
          type: integer
        skill_event_count:
          type: integer
        plan_event_count:
          type: integer
        decision_selected:
          type: boolean
        decision_blocked:
          type: boolean
        skill_selected:
          type: boolean
        interrupted:
          type: boolean
        failed:
          type: boolean
        completed:
          type: boolean

    InterruptRunResponse:
      type: object
      additionalProperties: false
      required: [run_id, status]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [interrupt_requested]

    StreamMessage:
      type: object
      additionalProperties: true
      properties:
        role:
          type: string
        content:
          type: string
        reasoning:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/StreamPlannedToolCall'
        warning_facts:
          type: array
          items:
            $ref: '#/components/schemas/StreamWarningFact'
        tool_call_id:
          type: string
        tool_name:
          type: string
        meta:
          type: object
          additionalProperties: true

    StreamAssistantDelta:
      type: object
      additionalProperties: false
      required: [sequence]
      properties:
        role:
          type: string
        delta:
          type: string
        reasoning:
          type: string
          description: Model thinking/reasoning content for reasoning-capable models
        sequence:
          type: integer
        message_id:
          type: string
        is_final:
          type: boolean
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/StreamPlannedToolCall'
        meta:
          type: object
          additionalProperties: true

    StreamPlannedToolCall:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        arguments_json:
          type: string

    StreamWarningScope:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [exact_file, directory, broad_workspace, unknown]
        path:
          type: string
        reason:
          type: string

    StreamWarningFact:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [file_collision, directory_overlap, unknown_scope]
        actor_ids:
          type: array
          items:
            type: string
        tool_names:
          type: array
          items:
            type: string
        paths:
          type: array
          items:
            type: string
        reason:
          type: string

    StreamInterruptContext:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        address:
          type: string
        info:
          type: object
          additionalProperties: true
        is_root_cause:
          type: boolean

    StreamInterrupt:
      type: object
      additionalProperties: false
      properties:
        context_count:
          type: integer
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/StreamInterruptContext'

    # --- Stream payload schemas ---

    ValidationError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    RunResult:
      type: object
      additionalProperties: false
      required: [run_id, status]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [running, succeeded, interrupted, failed]
        output:
          type: string
        error:
          type: string
        interrupted:
          type: object
          additionalProperties: true
        trace_summary:
          $ref: '#/components/schemas/TraceSummary'
