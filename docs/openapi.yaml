openapi: 3.1.0
info:
  title: Acorn Remote Client API
  version: 0.1.0
  description: |
    Remote client API for Acorn's single-user self-hosted agent backend.
    Client `/v1` run event endpoints stream the mobile live `RunEvent`
    subset projected from persisted backend events.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: health
  - name: devices
  - name: system
  - name: memory
  - name: skills
  - name: sessions
  - name: runs
  - name: client
paths:
  /healthz:
    get:
      tags: [health]
      security: []
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/devices:pair:
    post:
      tags: [devices]
      security: []
      summary: Pair a device with a one-time operator code
      operationId: clientPairDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairDeviceRequest'
      responses:
        '201':
          description: Device paired and access token issued once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairDeviceResponse'
        '400':
          $ref: '#/components/responses/InvalidPairingCode'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices:
    get:
      tags: [devices]
      summary: List paired devices
      operationId: clientListDevices
      responses:
        '200':
          description: Paired devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/{device_id}:
    delete:
      tags: [devices]
      summary: Revoke a paired device
      operationId: clientRevokeDevice
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '204':
          description: Device revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/{device_id}/push-token:
    put:
      tags: [devices]
      summary: Register the authenticated device push token
      operationId: clientRegisterDevicePushToken
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDevicePushTokenRequest'
      responses:
        '200':
          description: Push token registered without echoing the token value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePushToken'
        '400':
          $ref: '#/components/responses/InvalidPushProvider'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DevicePushTokenForbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/{device_id}/push-token/{provider}:
    delete:
      tags: [devices]
      summary: Revoke the authenticated device push token for one provider
      operationId: clientRevokeDevicePushToken
      parameters:
        - $ref: '#/components/parameters/DeviceID'
        - $ref: '#/components/parameters/PushProvider'
      responses:
        '204':
          description: Device push token revoked
        '400':
          $ref: '#/components/responses/InvalidPushProvider'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DevicePushTokenForbidden'
        '404':
          $ref: '#/components/responses/DevicePushTokenNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads:
    get:
      tags: [client]
      summary: List client threads
      operationId: clientListThreads
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Client threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [client]
      summary: Create a client thread
      operationId: clientCreateThread
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}:
    get:
      tags: [client]
      summary: Get one client thread
      operationId: clientGetThread
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '200':
          description: Thread found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [client]
      summary: Update a client thread
      operationId: clientUpdateThread
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThreadRequest'
      responses:
        '200':
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [client]
      summary: Delete a client thread
      operationId: clientDeleteThread
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '204':
          description: Thread deleted
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/messages:
    get:
      tags: [client]
      summary: List messages for a client thread
      operationId: clientListMessages
      parameters:
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages for the thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [client]
      summary: Append a user message without starting a run
      operationId: clientCreateMessage
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Message appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/runs:
    post:
      tags: [client]
      summary: Start a real runtime run for the latest unbound user message
      operationId: clientCreateRun
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created and execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '503':
          $ref: '#/components/responses/ExecutionNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{run_id}:
    get:
      tags: [client]
      summary: Get one client run
      operationId: clientGetRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{run_id}/events:
    get:
      tags: [client]
      summary: Replay and optionally follow mobile live RunEvent SSE
      description: |
        The response is `text/event-stream`. Each SSE message uses
        `id: <RunEvent.event_id>`, `event: <RunEvent.type>`, and `data:`
        containing the full RunEvent JSON object. The endpoint emits only the
        mobile live event subset. `after_seq` is an exclusive persisted cursor
        over the existing events table, so the server may advance the cursor
        across diagnostic events that are not emitted. Mobile clients persist
        `{run_id,last_seq}` locally, pass `last_seq` as `after_seq`, receive
        backlog events first, and then receive live follow events when
        `follow=true`.
      operationId: clientGetRunEvents
      parameters:
        - $ref: '#/components/parameters/RunID'
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Stream of mobile live RunEvent records
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RunEvent'
        '400':
          $ref: '#/components/responses/InvalidRunEventRequest'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '500':
          $ref: '#/components/responses/RunEventProjectionFailed'

  /v1/runs/{run_id}:interrupt:
    post:
      tags: [client]
      summary: Request interruption for a running client run
      operationId: clientInterruptRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '202':
          description: Interrupt requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptRunResponse'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/RunNotActive'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{run_id}:resume:
    post:
      tags: [client]
      summary: Resume an interrupted client run
      operationId: clientResumeRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Resume result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/RunNotResumable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/pending-actions:
    get:
      tags: [client]
      summary: List actionable pending client actions
      operationId: clientListPendingActions
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Actionable pending actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/pending-actions/{action_id}:
    get:
      tags: [client]
      summary: Load an actionable pending client action
      operationId: clientGetPendingAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pending action detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/PendingActionNotFound'
        '409':
          $ref: '#/components/responses/PendingActionAlreadyDecided'
        '500':
          $ref: '#/components/responses/RunEventProjectionFailed'

  /v1/pending-actions/{action_id}:decide:
    post:
      tags: [client]
      summary: Decide a pending client action
      operationId: clientDecidePendingAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecidePendingActionRequest'
      responses:
        '200':
          description: Pending action decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionDecision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/PendingActionNotFound'
        '409':
          $ref: '#/components/responses/PendingActionAlreadyDecided'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/inbox:
    get:
      tags: [client]
      summary: Load the mobile inbox aggregate
      description: |
        Returns one mobile-friendly attention aggregate over durable backend
        facts: pending actions, active runs, recent terminal runs, and system
        readiness. This endpoint does not replace source endpoints and does not
        introduce a second RunEvent store.
      operationId: clientGetInbox
      responses:
        '200':
          description: Mobile inbox aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{run_id}/detail:
    get:
      tags: [client]
      summary: Load the aggregate detail for a run
      operationId: clientGetRunDetail
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Aggregate run detail for remote clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '500':
          $ref: '#/components/responses/RunEventProjectionFailed'

  /v1/system/status:
    get:
      tags: [client]
      summary: Load remote client system status
      operationId: clientGetSystemStatus
      parameters:
        - $ref: '#/components/parameters/ProbeMCP'
      responses:
        '200':
          description: Remote client system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /v1/tools:
    get:
      tags: [client]
      summary: List tools for remote clients
      operationId: clientListTools
      parameters:
        - $ref: '#/components/parameters/ProbeMCP'
      responses:
        '200':
          description: Tool summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'

  /v1/settings:
    get:
      tags: [client]
      summary: Load remote client settings
      operationId: clientGetSettings
      responses:
        '200':
          description: Client settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSettings'
    patch:
      tags: [client]
      summary: Patch remote client settings
      operationId: clientPatchSettings
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '501':
          $ref: '#/components/responses/SettingsWriteUnsupported'

  /v1/memory/facts:
    get:
      tags: [memory]
      summary: List file-backed memory facts
      operationId: clientListMemoryFacts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/IncludeRetired'
      responses:
        '200':
          description: File-backed fact records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecordListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/memory/skills:
    get:
      tags: [memory]
      summary: List file-backed memory skills
      operationId: clientListMemorySkills
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/IncludeRetired'
      responses:
        '200':
          description: File-backed skill records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecordListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/memory/history:
    get:
      tags: [memory]
      summary: List file-backed memory history records
      operationId: clientListMemoryHistory
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/IncludeRetired'
      responses:
        '200':
          description: File-backed history records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecordListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/memory/search:
    get:
      tags: [memory]
      summary: Search file-backed memory facts, skills, and history
      operationId: clientSearchMemory
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: Memory kind.
          schema:
            type: string
            enum: [fact, skill, history]
        - name: scope
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/IncludeRetired'
      responses:
        '200':
          description: Memory search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/skills:
    get:
      tags: [skills]
      summary: List filesystem skills
      operationId: clientListSkills
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Skill list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{id}:
    get:
      tags: [skills]
      summary: Load one skill in detail
      operationId: clientGetSkill
      parameters:
        - $ref: '#/components/parameters/SkillId'
      responses:
        '200':
          description: Skill detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEnvelope'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{id}/files:
    get:
      tags: [skills]
      summary: Read a file from a skill package
      operationId: clientReadSkillFile
      parameters:
        - $ref: '#/components/parameters/SkillId'
        - name: path
          in: query
          required: false
          description: Relative path inside the skill package. Defaults to SKILL.md.
          schema:
            type: string
      responses:
        '200':
          description: Skill file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillFileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/checkpoint:
    get:
      tags: [client]
      summary: Load the current working checkpoint for a thread
      operationId: clientGetThreadCheckpoint
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '200':
          description: Working checkpoint payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingCheckpointEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [client]
      summary: Replace the current working checkpoint for a thread
      operationId: clientUpdateThreadCheckpoint
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkingCheckpointRequest'
      responses:
        '200':
          description: Updated working checkpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingCheckpointEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [client]
      summary: Clear the current working checkpoint for a thread
      operationId: clientDeleteThreadCheckpoint
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '204':
          description: Working checkpoint cleared
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    DeviceID:
      name: device_id
      in: path
      required: true
      schema:
        type: string
    PushProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [apns, fcm]
    ThreadID:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Positive integer limit. Defaults to 100.
      schema:
        type: integer
        minimum: 1
    IncludeInactive:
      name: include_inactive
      in: query
      required: false
      description: Include date-inactive and superseded memory records. Defaults to false.
      schema:
        type: boolean
        default: false
    IncludeRetired:
      name: include_retired
      in: query
      required: false
      description: Include retired memory records. Defaults to false.
      schema:
        type: boolean
        default: false
    Offset:
      name: offset
      in: query
      required: false
      description: Non-negative pagination offset. Defaults to 0.
      schema:
        type: integer
        minimum: 0
    ProbeMCP:
      name: probe_mcp
      in: query
      required: false
      description: Set to `1` to perform an explicit live MCP provider probe. Omit for passive capability reads.
      schema:
        type: string
        enum: ['1']

  responses:
    Unauthenticated:
      description: Device bearer token is missing, malformed, or unknown
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: unauthenticated
    DeviceRevoked:
      description: Device bearer token belongs to a revoked device
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            deviceRevoked:
              value:
                error:
                  code: device_revoked
                  message: device revoked
    InvalidPairingCode:
      description: Pairing code is missing, malformed, expired, used, or unknown
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
