        preview:
          type: string
        last_event_label:
          type: string
        attention_level:
          type: string
          enum: [normal, needs_action, failed, running]
        duration_ms:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

