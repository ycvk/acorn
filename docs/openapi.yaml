        path:
          type: string
        snippet:
          type: string
        score:
          type: number
          format: double
        created:
          type: string
        updated:
          type: string
        valid_from:
          type: string
        valid_until:
          type: string
        source_run:
          type: string
        source_refs:
          type: array
          items:
            type: string
        evidence_refs:
