openapi: 3.1.0
info:
  title: Acorn Remote Client API
  version: 0.1.0
  description: |
    Remote client API for Acorn's single-user self-hosted agent backend.
    Client `/v1` run event endpoints stream the mobile live `RunEvent`
    subset projected from persisted backend events.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: health
  - name: devices
  - name: system
  - name: skills
  - name: sessions
  - name: runs
  - name: client
  - name: captures
  - name: knowledge
  - name: memories
  - name: persona
  - name: owner
  - name: browser
paths:
  /healthz:
    get:
      tags: [health]
      security: []
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/devices:pair:
    post:
      tags: [devices]
      security: []
      summary: Pair a device with a one-time operator code
      operationId: clientPairDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairDeviceRequest'
      responses:
        '201':
          description: Device paired and access token issued once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairDeviceResponse'
        '400':
          $ref: '#/components/responses/InvalidPairingCode'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices:
    get:
      tags: [devices]
      summary: List paired devices
      operationId: clientListDevices
      responses:
        '200':
          description: Paired devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/{device_id}:
    delete:
      tags: [devices]
      summary: Revoke a paired device
      operationId: clientRevokeDevice
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '204':
          description: Device revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/self/push-installation:
    put:
      tags: [devices]
      summary: Register this device's Firebase installation ID for push notifications
      operationId: clientSetPushInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushInstallationRequest'
      responses:
        '204':
          description: Push installation stored
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads:
    get:
      tags: [client]
      summary: List client threads
      operationId: clientListThreads
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Client threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [client]
      summary: Create a client thread
      operationId: clientCreateThread
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}:
    get:
      tags: [client]
      summary: Get one client thread
      operationId: clientGetThread
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '200':
          description: Thread found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [client]
      summary: Update a client thread
      operationId: clientUpdateThread
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThreadRequest'
      responses:
        '200':
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [client]
      summary: Delete a client thread
      description: Deletes the conversation and makes Acorn forget it. Its messages and tool results are excluded from memory, with what was derived from them, before the thread, its runs and their records are removed. Knowledge notes and skills written in it stay; its commitments and watches keep running in a new thread. Refused while a run of the thread is running.
      operationId: clientDeleteThread
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '204':
          description: Thread deleted and forgotten
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '409':
          $ref: '#/components/responses/ThreadBusy'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/messages:
    get:
      tags: [client]
      summary: List messages for a client thread
      operationId: clientListMessages
      parameters:
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages for the thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [client]
      summary: Append a user message without starting a run
      operationId: clientCreateMessage
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Message appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/runs:
    post:
      tags: [client]
      summary: Start a runtime run; with input set, record the user message and run in one step (otherwise run the latest unbound user message)
      operationId: clientCreateRun
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created and execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '503':
          $ref: '#/components/responses/ExecutionNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/files:
    post:
      tags: [client]
      summary: Upload a file to send with the next message
      description: |
        Stores the file part as it streams in and returns its id. A run
        sends it with the owner's message when `CreateRunRequest.file_ids`
        names it; the agent sees images directly and finds every file on
        its workstation. The size cap is `files.max_upload_mib` (50 MiB by
        default).
      operationId: clientUploadThreadFile
      parameters:
        - $ref: '#/components/parameters/ThreadID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ThreadFileUploadRequest'
      responses:
        '201':
          description: File stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadFile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/ThreadNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/files/{file_id}:
    get:
      tags: [client]
      summary: Download a file of a thread
      description: |
        Returns the file bytes with its media type and name. File content
        never changes, so responses may be cached indefinitely.
      operationId: clientGetThreadFile
      parameters:
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/FileID'
      responses:
        '200':
          description: The file
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/ThreadFileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/views/{view_id}/actions:
    post:
      tags: [client]
      summary: Send what the owner pressed or chose in a view as their message
      description: |
        Names a Button or ChoicePicker of the view, the item of each List it
        is drawn for, and for a choice the option ids picked. The backend
        resolves the action against the stored view, records the owner's
        message (the button's label, or the chosen options) and starts a run
        on it, like a message the owner typed. Each action of a view, that
        is each component per List item, is sent once.
      operationId: clientSendViewAction
      parameters:
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/ViewID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendViewActionRequest'
      responses:
        '201':
          description: Message recorded and run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/ViewNotFound'
        '409':
          $ref: '#/components/responses/ViewActionTaken'
        '503':
          $ref: '#/components/responses/ExecutionNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/views/{view_id}:pin:
    post:
      tags: [client]
      summary: Pin a view to the now page as a panel
      description: |
        Lists the view under `panels` on the now page; a tap on the panel
        returns to its conversation. Pinning a pinned view keeps its place.
        While pinned, a view whose `source` names a package trigger takes the
        data of each `view_data` line the trigger prints.
      operationId: clientPinView
      parameters:
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/ViewID'
      responses:
        '200':
          description: The view, pinned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/ViewNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/threads/{thread_id}/views/{view_id}:unpin:
    post:
      tags: [client]
      summary: Take a view off the now page
      description: The view stays in its conversation; a trigger no longer feeds it.
      operationId: clientUnpinView
      parameters:
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/ViewID'
      responses:
        '200':
          description: The view, not pinned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/ViewNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{run_id}:
    get:
      tags: [client]
      summary: Get one client run
      operationId: clientGetRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{run_id}/events:
    get:
      tags: [client]
      summary: Replay and optionally follow mobile live RunEvent SSE
      description: |
        The response is `text/event-stream`. Each SSE message uses
        `id: <RunEvent.event_id>`, `event: <RunEvent.type>`, and `data:`
        containing the full RunEvent JSON object. The endpoint emits only the
        mobile live event subset. `after_seq` is an exclusive persisted cursor
        over the existing events table, so the server may advance the cursor
        across diagnostic events that are not emitted. Mobile clients persist
        `{run_id,last_seq}` locally, pass `last_seq` as `after_seq`, receive
        backlog events first, and then receive live follow events when
        `follow=true`. A followed stream ends once the run has succeeded or
        failed; it stays open while the run is interrupted, because the server
        resumes the run after the owner decides.
      operationId: clientGetRunEvents
      parameters:
        - $ref: '#/components/parameters/RunID'
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Stream of mobile live RunEvent records
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RunEvent'
        '400':
          $ref: '#/components/responses/InvalidRunEventRequest'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '500':
          $ref: '#/components/responses/RunEventProjectionFailed'

  /v1/runs/{run_id}:interrupt:
    post:
      tags: [client]
      summary: Request interruption for a running client run
      operationId: clientInterruptRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '202':
          description: Interrupt requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptRunResponse'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/RunNotActive'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/pending-actions:
    get:
      tags: [client]
      summary: List actionable pending client actions
      operationId: clientListPendingActions
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Actionable pending actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/pending-actions/{action_id}:
    get:
      tags: [client]
      summary: Load an actionable pending client action
      operationId: clientGetPendingAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pending action detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/PendingActionNotFound'
        '409':
          $ref: '#/components/responses/PendingActionAlreadyDecided'
        '500':
          $ref: '#/components/responses/RunEventProjectionFailed'

  /v1/pending-actions/{action_id}:decide:
    post:
      tags: [client]
      summary: Decide a pending client action
      operationId: clientDecidePendingAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecidePendingActionRequest'
      responses:
        '200':
          description: Pending action decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionDecision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/PendingActionNotFound'
        '409':
          $ref: '#/components/responses/PendingActionAlreadyDecided'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/inbox:
    get:
      tags: [client]
      summary: Load the mobile inbox aggregate
      description: |
        Returns one mobile-friendly attention aggregate over durable backend
        facts: pending actions, active runs, recent terminal runs, and system
        readiness. This endpoint does not replace source endpoints and does not
        introduce a second RunEvent store.
      operationId: clientGetInbox
      responses:
        '200':
          description: Mobile inbox aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/now:
    get:
      tags: [client]
      summary: Load the now page
      description: |
        Returns the latest morning briefing note, the scheduled and due
        commitments with the occurrences that wait for an outcome, the active
        and waiting concerns, and every watch with failing watches first. A
        failing read of any section fails the request.
      operationId: clientGetNow
      responses:
        '200':
          description: Now page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NowResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/commitments/{commitment_id}:cancel:
    post:
      tags: [client]
      summary: Cancel a commitment
      description: |
        Cancels the commitment and its unsettled occurrences, the same change
        the agent makes with its settle tool.
      operationId: clientCancelCommitment
      parameters:
        - $ref: '#/components/parameters/CommitmentID'
      responses:
        '204':
          description: Commitment cancelled
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/CommitmentNotFound'
        '409':
          $ref: '#/components/responses/CommitmentEnded'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/watches/{watch_id}:pause:
    post:
      tags: [client]
      summary: Pause a watch
      operationId: clientPauseWatch
      parameters:
        - $ref: '#/components/parameters/WatchID'
      responses:
        '204':
          description: Watch paused
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/WatchNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/watches/{watch_id}:resume:
    post:
      tags: [client]
      summary: Resume a watch
      description: Checks the watch right away and clears its failures.
      operationId: clientResumeWatch
      parameters:
        - $ref: '#/components/parameters/WatchID'
      responses:
        '204':
          description: Watch resumed
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/WatchNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{run_id}/detail:
    get:
      tags: [client]
      summary: Load the aggregate detail for a run
      operationId: clientGetRunDetail
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Aggregate run detail for remote clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '500':
          $ref: '#/components/responses/RunEventProjectionFailed'

  /v1/browser/tabs:
    get:
      tags: [browser]
      summary: List the pages of the agent's browser
      description: |
        The agent's browser runs on its workstation. The owner watches and
        uses it to sign in to sites for the agent. Pages are listed most
        recently used first.
      operationId: clientListBrowserTabs
      responses:
        '200':
          description: Pages of the agent's browser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserTabListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '503':
          $ref: '#/components/responses/BrowserUnavailable'

  /v1/browser/frames:
    get:
      tags: [browser]
      summary: Stream a page of the agent's browser
      description: |
        The response is `text/event-stream`. Each `event: frame` message
        carries a BrowserFrame in `data:`; a new frame arrives when the
        page's image changes, at most five a second, and the next frame waits
        until the previous one is read. The streamed tab comes to the front.
        Comment lines keep the connection open. An `event: error` message
        with an ErrorResponse-like `{"error": "..."}` body ends a stream that
        failed, for example because the page was closed.

        With `width` and `height`, the page is laid out as a phone screen of
        that many CSS pixels while the stream lasts, and frames carry two image
        pixels per unit of their width and height; give both or neither.
      operationId: clientStreamBrowserFrames
      parameters:
        - name: tab
          in: query
          required: true
          schema:
            type: string
        - name: width
          in: query
          required: false
          schema:
            type: integer
            minimum: 240
            maximum: 1280
        - name: height
          in: query
          required: false
          schema:
            type: integer
            minimum: 240
            maximum: 2400
      responses:
        '200':
          description: Stream of frames of the page
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/BrowserFrame'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/BrowserTabNotFound'
        '503':
          $ref: '#/components/responses/BrowserUnavailable'

  /v1/browser/input:
    post:
      tags: [browser]
      summary: Use a page of the agent's browser
      description: |
        Performs one input on the page: a tap, scroll or drag at points of a
        frame, in the units of the frame's width and height (a page zoomed out
        to fit the phone is mapped back onto the page), typed text, a key,
        navigation to an http(s) URL, back or reload.

        A drag plays on the page at the times the finger made it, 150 ms after
        its `down` arrives, so moves sent in batches reach the page at the
        finger's own spacing. A batch that arrives after its points are due
        plays at once and the rest of the drag moves back by as much. `down`
        and `move` return once queued; `up` returns once the drag has played,
        with any failure in it. While a drag plays, frames come from the
        browser's screencast at one image pixel per unit.
      operationId: clientBrowserInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserInputRequest'
      responses:
        '204':
          description: Input performed
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/BrowserTabNotFound'
        '503':
          $ref: '#/components/responses/BrowserUnavailable'

  /v1/system/status:
    get:
      tags: [client]
      summary: Load remote client system status
      operationId: clientGetSystemStatus
      parameters:
        - $ref: '#/components/parameters/ProbeMCP'
      responses:
        '200':
          description: Remote client system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /v1/tools:
    get:
      tags: [client]
      summary: List tools for remote clients
      operationId: clientListTools
      parameters:
        - $ref: '#/components/parameters/ProbeMCP'
      responses:
        '200':
          description: Tool summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'

  /v1/skills:
    get:
      tags: [skills]
      summary: List every skill
      description: |
        Every stored skill, retired ones included, with its current revision.
        `eligible` says whether the next run lists the skill: it is in use, its
        SKILL.md and manifest parse, it has the tools it requires and its
        package's secrets have values. A skill whose current revision does not
        parse carries `problem` instead of failing the list.
      operationId: clientListSkills
      responses:
        '200':
          description: Skill list, by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{name}:
    get:
      tags: [skills]
      summary: Load one skill
      description: |
        The skill's current revision with its SKILL.md and files, the run that
        wrote it, and, when it has a manifest that parses, what its package
        declares and how it runs. The package's state comes from the same
        sources as `acorn doctor` and is reported only while the skill is in
        use; secrets say only whether each has a value.
      operationId: clientGetSkill
      parameters:
        - $ref: '#/components/parameters/SkillName'
      responses:
        '200':
          description: Skill detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{name}:rollback:
    post:
      tags: [skills]
      summary: Roll a skill back to an earlier revision
      description: |
        Writes the SKILL.md and files of `revision` as the owner's new revision
        on top of `base_revision`, the revision the owner read. The skill is in
        use afterwards. The content passes the checks every write passes. Owner
        changes need no approval.
      operationId: clientRollbackSkill
      parameters:
        - $ref: '#/components/parameters/SkillName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackSkillRequest'
      responses:
        '200':
          description: The skill at its new revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillSummary'
        '400':
          $ref: '#/components/responses/SkillChangeInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '409':
          $ref: '#/components/responses/SkillChanged'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{name}:retire:
    post:
      tags: [skills]
      summary: Retire a skill
      description: Takes a skill in use out of use as the owner's revision on top of `base_revision`.
      operationId: clientRetireSkill
      parameters:
        - $ref: '#/components/parameters/SkillName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillChangeRequest'
      responses:
        '200':
          description: The skill at its new revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillSummary'
        '400':
          $ref: '#/components/responses/SkillChangeInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '409':
          $ref: '#/components/responses/SkillChanged'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{name}:restore:
    post:
      tags: [skills]
      summary: Restore a retired skill
      description: |
        Brings a retired skill back into use with the content it has, as the
        owner's revision on top of `base_revision`. The content passes the
        checks every write passes.
      operationId: clientRestoreSkill
      parameters:
        - $ref: '#/components/parameters/SkillName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillChangeRequest'
      responses:
        '200':
          description: The skill at its new revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillSummary'
        '400':
          $ref: '#/components/responses/SkillChangeInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '409':
          $ref: '#/components/responses/SkillChanged'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{name}/revisions:
    get:
      tags: [skills]
      summary: List a skill's revisions
      operationId: clientListSkillRevisions
      parameters:
        - $ref: '#/components/parameters/SkillName'
      responses:
        '200':
          description: Every revision without content, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillRevisionListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{name}/revisions/{revision}:
    get:
      tags: [skills]
      summary: Load one revision of a skill
      operationId: clientGetSkillRevision
      parameters:
        - $ref: '#/components/parameters/SkillName'
        - $ref: '#/components/parameters/SkillRevision'
      responses:
        '200':
          description: The revision with its content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillRevision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{name}/diff:
    get:
      tags: [skills]
      summary: Compare two revisions of a skill
      description: |
        How the package changes from revision `from` to revision `to`, file by
        file: SKILL.md first, then the other files by path. Files that are the
        same in both are left out. Text files come as line hunks with three
        unchanged lines of context; other files only say that they changed.
      operationId: clientDiffSkillRevisions
      parameters:
        - $ref: '#/components/parameters/SkillName'
        - $ref: '#/components/parameters/SkillDiffFrom'
        - $ref: '#/components/parameters/SkillDiffTo'
      responses:
        '200':
          description: The differences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDiff'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/skills/{name}/secrets/{secret}:
    put:
      tags: [skills]
      summary: Set a secret of a skill's package
      description: |
        Stores the value of a secret the manifest of the skill's current
        revision declares, the same as `acorn skills secret set`. The package's
        MCP server and trigger commands get it as an environment variable from
        the next run on. Values are write-only: no response carries one.
      operationId: clientSetSkillSecret
      parameters:
        - $ref: '#/components/parameters/SkillName'
        - $ref: '#/components/parameters/SkillSecretName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSkillSecretRequest'
      responses:
        '200':
          description: Which declared secrets have a value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillSecretListResponse'
        '400':
          $ref: '#/components/responses/SkillChangeInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [skills]
      summary: Clear a secret of a skill's package
      description: Removes the value of a secret the manifest of the skill's current revision declares.
      operationId: clientClearSkillSecret
      parameters:
        - $ref: '#/components/parameters/SkillName'
        - $ref: '#/components/parameters/SkillSecretName'
      responses:
        '200':
          description: Which declared secrets have a value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillSecretListResponse'
        '400':
          $ref: '#/components/responses/SkillChangeInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/SkillNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/phone-notifications:
    post:
      tags: [phone-notifications]
      operationId: clientPostPhoneNotifications
      summary: Upload notifications captured by this device
      description: Stores background signals without waking the agent. Entries are deduplicated by authenticated device, key and posted_at. Raw signals are retained for seven days; derived conversation, context snapshot and knowledge records follow their own retention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNotificationBatch'
      responses:
        '200':
          description: Batch stored, including already accepted entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNotificationAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/captures:
    post:
      tags: [captures]
      summary: Hand the agent something shared from the phone
      description: |
        Starts a run in a new thread whose input (role `capture`) lists the
        shared subject, text and image. An image is stored under
        `attachments/` in the storage directory before the run starts. Text or an image is
        required.
      operationId: clientCreateCapture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
      responses:
        '202':
          description: Capture accepted; the run has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ExecutionNotReady'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/knowledge/notes:
    get:
      tags: [knowledge]
      summary: Search or list knowledge base notes
      description: |
        With `q`, notes ranked by relevance; without it, notes by update time,
        newest first.
      operationId: clientListKnowledgeNotes
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: prefix
          in: query
          required: false
          description: Only notes whose path starts with this. Ignored with `q`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeNoteListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/knowledge/note:
    get:
      tags: [knowledge]
      summary: Read one knowledge base note
      operationId: clientGetKnowledgeNote
      parameters:
        - name: path
          in: query
          required: true
          description: Note path relative to the knowledge base, e.g. inbox/tokio.md.
          schema:
            type: string
      responses:
        '200':
          description: The note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeNote'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/KnowledgeNoteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [knowledge]
      summary: Delete one knowledge base note
      description: Deletes the note and makes Acorn forget it. Every revision of the note is excluded from memory, with what was derived from it, before the note and its revisions are removed. Images the note links stay. Refused when the note changed while it was being forgotten; deleting again forgets the new revision too.
      operationId: clientDeleteKnowledgeNote
      parameters:
        - name: path
          in: query
          required: true
          description: Note path relative to the knowledge base, e.g. inbox/tokio.md.
          schema:
            type: string
      responses:
        '204':
          description: Note deleted and forgotten
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/KnowledgeNoteNotFound'
        '409':
          $ref: '#/components/responses/KnowledgeNoteChanged'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/knowledge/attachment:
    get:
      tags: [knowledge]
      summary: Read an image stored by a capture
      description: |
        Returns the image bytes. Notes embed attachments as
        `![alt](attachments/...)`, and a capture input names its image on an
        `Image:` line. Attachment paths never change content, so responses
        may be cached indefinitely.
      operationId: clientGetKnowledgeAttachment
      parameters:
        - name: path
          in: query
          required: true
          description: Attachment path relative to the storage directory, e.g. attachments/2026/10/0123456789abcdef.png.
          schema:
            type: string
      responses:
        '200':
          description: The image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/KnowledgeAttachmentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/memories:
    get:
      tags: [memories]
      summary: Search or list what Acorn remembers
      description: |
        Current facts, insights and open thoughts. With `q`, memories whose
        text matches; without it, memories by last change, newest first.
        Forgotten memories never appear.
      operationId: clientListMemories
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [fact, insight, thought]
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Memories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/memories/{memory_id}:
    get:
      tags: [memories]
      summary: Read a memory with its evidence and history
      description: |
        Evidence lists the quotes the memory rests on and where each came
        from; evidence from forgotten sources is left out. `based_on` holds
        the memories an insight was drawn from, and `earlier` the memory's
        previous wordings, newest first.
      operationId: clientGetMemory
      parameters:
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '200':
          description: The memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/memories/{memory_id}:forget:
    post:
      tags: [memories]
      summary: Forget a memory
      description: |
        Excludes the memory from everything Acorn uses from now on. Forgetting
        a fact also excludes the quotes it rests on and every memory drawn from
        them; forgetting an insight or thought withdraws only that memory. Runs
        that saw the memory are stopped before the response. The original
        messages and notes stay where they are.
      operationId: clientForgetMemory
      parameters:
        - $ref: '#/components/parameters/MemoryID'
      responses:
        '200':
          description: Forgotten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryForgetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/memories/{memory_id}:correct:
    post:
      tags: [memories]
      summary: Correct a fact
      description: |
        Replaces a fact with the owner's wording, which becomes its evidence.
        The previous wording stays in the new fact's history. Only facts can
        be corrected; `revision` is the revision the owner read.
      operationId: clientCorrectMemory
      parameters:
        - $ref: '#/components/parameters/MemoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectMemoryRequest'
      responses:
        '200':
          description: The corrected fact, under a new id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
        '409':
          $ref: '#/components/responses/MemoryChanged'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/persona:
    get:
      tags: [persona]
      summary: Load the current persona
      description: |
        The persona is who the agent is and how it talks. Every run reads the
        current revision when it starts.
      operationId: clientGetPersona
      responses:
        '200':
          description: The current persona revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [persona]
      summary: Save the persona
      description: |
        Saves `content`, trimmed, as a new revision by the owner from this
        device. `base_revision` is the revision the owner edited; saving fails
        when the persona has changed since. Restoring an old revision saves its
        content the same way.
      operationId: clientSavePersona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePersonaRequest'
      responses:
        '200':
          description: The saved revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '409':
          $ref: '#/components/responses/PersonaChanged'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/persona/revisions:
    get:
      tags: [persona]
      summary: List the persona revisions
      operationId: clientListPersonaRevisions
      responses:
        '200':
          description: Every revision without content, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaRevisionListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/persona/revisions/{revision}:
    get:
      tags: [persona]
      summary: Load one persona revision
      operationId: clientGetPersonaRevision
      parameters:
        - $ref: '#/components/parameters/PersonaRevision'
      responses:
        '200':
          description: The revision with its content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '404':
          $ref: '#/components/responses/PersonaNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/owner:
    get:
      tags: [owner]
      summary: Load what Acorn calls the owner
      description: |
        Every run and every memory extraction reads the current name. An
        empty name means Acorn calls the owner "the owner".
      operationId: clientGetOwner
      responses:
        '200':
          description: What Acorn calls the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [owner]
      summary: Set what Acorn calls the owner
      description: |
        Saves `name`, trimmed. An empty name leaves the owner unnamed. The
        next run uses it; facts already written keep the name they were
        written with.
      operationId: clientSetOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOwnerRequest'
      responses:
        '200':
          description: The saved name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    DeviceID:
      name: device_id
      in: path
      required: true
      schema:
        type: string
    ThreadID:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
    ViewID:
      name: view_id
      in: path
      required: true
      schema:
        type: string
    SkillName:
      name: name
      in: path
      required: true
      schema:
        type: string
    SkillRevision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SkillSecretName:
      name: secret
      in: path
      required: true
      schema:
        type: string
    SkillDiffFrom:
      name: from
      in: query
      required: true
      description: The revision the differences start from.
      schema:
        type: integer
        format: int64
        minimum: 1
    SkillDiffTo:
      name: to
      in: query
      required: true
      description: The revision the differences lead to.
      schema:
        type: integer
        format: int64
        minimum: 1
    CommitmentID:
      name: commitment_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    WatchID:
      name: watch_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      required: false
      description: Positive integer limit. Defaults to 100.
      schema:
        type: integer
        minimum: 1
    Offset:
      name: offset
      in: query
      required: false
      description: Non-negative pagination offset. Defaults to 0.
      schema:
        type: integer
        minimum: 0
    MemoryID:
      name: memory_id
      in: path
      required: true
      schema:
        type: string
    PersonaRevision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProbeMCP:
      name: probe_mcp
      in: query
      required: false
      description: Set to `1` to perform an explicit live MCP provider probe. Omit for passive capability reads.
      schema:
        type: string
        enum: ['1']

  responses:
    Unauthenticated:
      description: Device bearer token is missing, malformed, or unknown
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: unauthenticated
    DeviceRevoked:
      description: Device bearer token belongs to a revoked device
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            deviceRevoked:
              value:
                error:
                  code: device_revoked
                  message: device revoked
    InvalidPairingCode:
      description: Pairing code is missing, malformed, expired, used, or unknown
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidPairingCode:
              value:
                error:
                  code: invalid_pairing_code
                  message: invalid pairing code
    DeviceNotFound:
      description: Device not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            deviceNotFound:
              value:
                error:
                  code: device_not_found
                  message: device not found
    KnowledgeNoteNotFound:
      description: Knowledge note not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            knowledgeNoteNotFound:
              value:
                error:
                  code: knowledge_note_not_found
                  message: 'knowledge note not found: inbox/missing.md'
    KnowledgeNoteChanged:
      description: The note changed while it was being deleted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            knowledgeNoteChanged:
              value:
                error:
                  code: knowledge_note_conflict
                  message: 'knowledge note changed concurrently: inbox/tokio.md is at revision 4, not 3'
    MemoryNotFound:
      description: Memory not found or forgotten
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            memoryNotFound:
              value:
                error:
                  code: memory_not_found
                  message: 'memory not found: record m_0123'
    ViewNotFound:
      description: The thread has no view with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            viewNotFound:
              value:
                error:
                  code: view_not_found
                  message: 'thread view not found: view_0123 in thread session_1'
    ViewActionTaken:
      description: This action of the view was already sent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            viewActionTaken:
              value:
                error:
                  code: view_action_taken
                  message: 'send view action save: view action already sent: save of view_0123'
    ThreadBusy:
      description: A run of the thread is still running
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            threadBusy:
              value:
                error:
                  code: thread_busy
                  message: 'thread has a running run: session_1'
    MemoryChanged:
      description: The memory changed since the client read it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            memoryChanged:
              value:
                error:
                  code: memory_changed
                  message: the memory changed since it was read; reload it and try again
    PersonaChanged:
      description: The persona changed since the client read it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            personaChanged:
              value:
                error:
                  code: persona_changed
                  message: the persona changed since it was read; reload it and try again
    PersonaNotFound:
      description: No persona revision with that number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            personaNotFound:
              value:
                error:
                  code: persona_not_found
                  message: 'persona not found: revision 9'
    KnowledgeAttachmentNotFound:
      description: Attachment not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            knowledgeAttachmentNotFound:
              value:
                error:
                  code: knowledge_attachment_not_found
                  message: 'attachment not found: attachments/2026/10/0123456789abcdef.png'
    CommitmentNotFound:
      description: Commitment not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            commitmentNotFound:
              value:
                error:
                  code: commitment_not_found
                  message: commitment not found
    CommitmentEnded:
      description: Commitment is already completed or cancelled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            commitmentEnded:
              value:
                error:
                  code: commitment_ended
                  message: 'commitment already ended: commitment 7 is cancelled'
    WatchNotFound:
      description: Watch not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            watchNotFound:
              value:
                error:
                  code: watch_not_found
                  message: 'watch not found: 3'
    PayloadTooLarge:
      description: Request body too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            payloadTooLarge:
              value:
                error:
                  code: payload_too_large
                  message: image is larger than 10 MiB
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRequest:
              value:
                error:
                  code: invalid_request
                  message: content is required
    ThreadNotFound:
      description: Client thread not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            threadNotFound:
              value:
                error:
                  code: thread_not_found
                  message: session thread_123 not found
    ThreadFileNotFound:
      description: No file with this id in the thread
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            threadFileNotFound:
              value:
                error:
                  code: thread_file_not_found
                  message: 'thread file not found: file_0123 in thread thread_123'
    RunNotFound:
      description: Run not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            runNotFound:
              value:
                error:
                  code: run_not_found
                  message: run run_123 not found
    RunNotActive:
      description: Run exists but is not currently active
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            runNotActive:
              value:
                error:
                  code: run_not_active
                  message: run not active
    PendingActionNotFound:
      description: Pending action not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            pendingActionNotFound:
              value:
                error:
                  code: pending_action_not_found
                  message: pending action not found
    PendingActionAlreadyDecided:
      description: Pending action has already been decided
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            pendingActionAlreadyDecided:
              value:
                error:
                  code: pending_action_already_decided
                  message: pending action already decided
    InvalidRunEventRequest:
      description: Invalid RunEvent replay request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidAfterSeq:
              value:
                error:
                  code: invalid_after_seq
                  message: after_seq must be a non-negative integer
            invalidFollow:
              value:
                error:
                  code: invalid_request
                  message: follow must be a boolean
    RunEventProjectionFailed:
      description: Persisted live run event could not be projected into RunEvent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            projectionFailed:
              value:
                error:
                  code: run_event_projection_failed
                  message: client projection failed
    SkillNotFound:
      description: Skill not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            skillNotFound:
              value:
                error:
                  code: skill_not_found
                  message: 'skill not found: inspect-repo'
    SkillChanged:
      description: The skill changed since the client read it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            skillChanged:
              value:
                error:
                  code: skill_changed
                  message: the skill changed since it was read; reload it and try again
    SkillChangeInvalid:
      description: The change does not fit the skill, or the request is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            alreadyRetired:
              value:
                error:
                  code: skill_change_invalid
                  message: 'invalid skill change: skill orders is already retired'
    ExecutionNotReady:
      description: Execution paths are unavailable because required model/runtime config is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            executionNotReady:
              value:
                error:
                  code: execution_not_ready
                  message: 'execution not ready: model.api_key is required'
    BrowserUnavailable:
      description: The agent has no workstation, or its browser cannot be reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            browserUnavailable:
              value:
                error:
                  code: browser_unavailable
                  message: the agent has no workstation; set workstation.url
    BrowserTabNotFound:
      description: The agent's browser has no such page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            browserTabNotFound:
              value:
                error:
                  code: browser_tab_not_found
                  message: 'no such tab in the workstation''s browser: T1'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                error:
                  code: internal_error
                  message: internal server error

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean

    Device:
      type: object
      additionalProperties: false
      required: [device_id, name, platform, created_at, last_seen_at]
      properties:
        device_id:
          type: string
        name:
          type: string
        platform:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    PairDeviceRequest:
      type: object
      additionalProperties: false
      required: [pairing_code, device_name, platform]
      properties:
        pairing_code:
          type: string
        device_name:
          type: string
        platform:
          type: string

    PairDeviceResponse:
      type: object
      additionalProperties: false
      required: [device, access_token]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        access_token:
          type: string

    SkillSummary:
      type: object
      additionalProperties: false
      required: [name, revision, author, updated_at, retired, eligible, file_count, has_manifest]
      properties:
        name:
          type: string
        description:
          type: string
          description: Absent when SKILL.md does not parse.
        revision:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/SkillAuthor'
        updated_at:
          type: string
          format: date-time
        retired:
          type: boolean
        eligible:
          type: boolean
          description: Whether the next run lists the skill.
        disabled_reasons:
          type: array
          description: Why a skill in use is not listed, such as `missing_secrets:NAME` or `files_need_workstation`.
          items:
            type: string
        file_count:
          type: integer
          description: Number of files the skill carries besides its SKILL.md.
        has_manifest:
          type: boolean
          description: Whether the package carries acorn-package.yaml.
        problem:
          type: string
          description: Why the current revision's SKILL.md or manifest does not parse.

    SkillAuthor:
      type: string
      enum: [agent, owner, release]

    SkillFile:
      type: object
      additionalProperties: false
      required: [path, size]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        content:
          type: string
          description: The file's content, for UTF-8 text files of at most 64 KiB.

    SkillDetail:
      type: object
      additionalProperties: false
      required: [name, revision, author, updated_at, retired, eligible, file_count, has_manifest, sha256, markdown, files]
      properties:
        name:
          type: string
        description:
          type: string
        revision:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/SkillAuthor'
        updated_at:
          type: string
          format: date-time
        retired:
          type: boolean
        eligible:
          type: boolean
        disabled_reasons:
          type: array
          items:
            type: string
        file_count:
          type: integer
        has_manifest:
          type: boolean
        problem:
          type: string
        run_id:
          type: string
          description: The run that wrote the current revision; absent for the owner's and the release's revisions.
        sha256:
          type: string
          description: Names the package the current revision holds.
        markdown:
          type: string
          description: The whole SKILL.md.
        instruction:
          type: string
          description: SKILL.md after its frontmatter; absent when it does not parse.
        files:
          type: array
          items:
            $ref: '#/components/schemas/SkillFile'
        package:
          $ref: '#/components/schemas/SkillPackage'

    SkillPackage:
      type: object
      additionalProperties: false
      required: [triggers, secrets]
      description: What the manifest declares and, while the skill is in use, how it runs.
      properties:
        mcp:
          $ref: '#/components/schemas/SkillPackageServer'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/SkillPackageTrigger'
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SkillSecret'

    SkillPackageServer:
      type: object
      additionalProperties: false
      required: [command_line]
      properties:
        command_line:
          type: string
          description: The command and its arguments, quoted where a shell would split them.
        state:
          type: string
          enum: [ready, failed, stopped, missing_secrets, 'off', unknown]
          description: Absent while the skill is retired. `off` means no workstation is configured; `unknown` that the workstation did not answer.
        error:
          type: string

    SkillPackageTrigger:
      type: object
      additionalProperties: false
      required: [name, schedule, deliver, run]
      properties:
        name:
          type: string
        schedule:
          type: string
          description: Cron expression in the owner's time zone.
        deliver:
          type: string
          enum: [immediate, digest]
        run:
          type: string
        state:
          type: string
          enum: [scheduled, failing, unscheduled, missing_secrets, 'off']
          description: Absent while the skill is retired.
        next_at:
          type: string
          format: date-time
        failures:
          type: integer
        last_error:
          type: string

    SkillSecret:
      type: object
      additionalProperties: false
      required: [name, set]
      properties:
        name:
          type: string
        set:
          type: boolean

    SkillSecretListResponse:
      type: object
      additionalProperties: false
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SkillSecret'

    SetSkillSecretRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          description: At most 64 KiB.

    SkillListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SkillSummary'

    SkillEnvelope:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/SkillDetail'

    SkillRevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, author, at, retired, sha256]
      properties:
        revision:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/SkillAuthor'
        run_id:
          type: string
          description: The run that wrote the revision; absent for the owner's and the release's revisions.
        at:
          type: string
          format: date-time
        retired:
          type: boolean
          description: Whether the skill was out of use from this revision.
        sha256:
          type: string
          description: Names the package the revision holds; revisions with the same content share it.

    SkillRevisionListResponse:
      type: object
      additionalProperties: false
      required: [revisions]
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/SkillRevisionSummary'

    SkillRevision:
      type: object
      additionalProperties: false
      required: [name, revision, author, at, retired, sha256, markdown, files]
      properties:
        name:
          type: string
        revision:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/SkillAuthor'
        run_id:
          type: string
        at:
          type: string
          format: date-time
        retired:
          type: boolean
        sha256:
          type: string
        markdown:
          type: string
        instruction:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/SkillFile'
        problem:
          type: string
          description: Why the revision's SKILL.md or manifest does not parse.

    SkillDiff:
      type: object
      additionalProperties: false
      required: [name, from, to, files]
      properties:
        name:
          type: string
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        files:
          type: array
          items:
            $ref: '#/components/schemas/SkillFileDiff'

    SkillFileDiff:
      type: object
      additionalProperties: false
      required: [path, change, binary, hunks]
      properties:
        path:
          type: string
        change:
          type: string
          enum: [added, removed, modified]
        binary:
          type: boolean
          description: The file is not UTF-8 text on one side; it has no hunks.
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/SkillDiffHunk'

    SkillDiffHunk:
      type: object
      additionalProperties: false
      required: [old_start, new_start, lines]
      properties:
        old_start:
          type: integer
          description: Line number of the hunk's first line in `from`, from 1.
        new_start:
          type: integer
          description: Line number of the hunk's first line in `to`, from 1.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SkillDiffLine'

    SkillDiffLine:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [same, added, removed]
        text:
          type: string

    RollbackSkillRequest:
      type: object
      additionalProperties: false
      required: [revision, base_revision]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The revision whose content to write again.
        base_revision:
          type: integer
          format: int64
          minimum: 1
          description: The current revision the owner read.

    SkillChangeRequest:
      type: object
      additionalProperties: false
      required: [base_revision]
      properties:
        base_revision:
          type: integer
          format: int64
          minimum: 1
          description: The current revision the owner read.

    CapabilitiesSummary:
      type: object
      additionalProperties: false
      required:
        - tool_count
        - enabled_tool_count
        - skill_count
        - eligible_skill_count
        - ineligible_skill_count
        - invalid_skill_count
        - mcp_configured_provider_count
        - mcp_enabled_provider_count
        - mcp_healthy_provider_count
      properties:
        tool_count:
          type: integer
        enabled_tool_count:
          type: integer
        skill_count:
          type: integer
        eligible_skill_count:
          type: integer
        ineligible_skill_count:
          type: integer
        invalid_skill_count:
          type: integer
        mcp_configured_provider_count:
          type: integer
        mcp_enabled_provider_count:
          type: integer
        mcp_healthy_provider_count:
          type: integer

    CapabilitiesModel:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string

    CapabilitiesFeatures:
      type: object
      additionalProperties: false
      required:
        - session_history
      properties:
        session_history:
          type: boolean

    CapabilitiesTool:
      type: object
      additionalProperties: false
      required: [name, source, kind, category, enabled, health_state, risk]
      properties:
        name:
          type: string
        source:
          type: string
        kind:
          type: string
        category:
          type: string
        enabled:
          type: boolean
        health_state:
          type: string
        health_reason:
          type: string
        risk:
          type: string

    SystemStatus:
      type: object
      additionalProperties: false
      required: [runtime_readiness, model, summary, features]
      properties:
        runtime_readiness:
          $ref: '#/components/schemas/RuntimeReadiness'
        provider_readiness:
          type: array
          items:
            $ref: '#/components/schemas/ProviderReadiness'
        model:
          $ref: '#/components/schemas/CapabilitiesModel'
        summary:
          $ref: '#/components/schemas/CapabilitiesSummary'
        features:
          $ref: '#/components/schemas/CapabilitiesFeatures'

    RuntimeReadiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, blocked]
        reason:
          type: string

    ProviderReadiness:
      type: object
      additionalProperties: false
      required: [scope, provider, status]
      properties:
        scope:
          type: string
        provider:
          type: string
        status:
          type: string
          enum: [passed, failed, blocked]
        reason:
          type: string
        startup_status:
          type: string
        auth_status:
          type: string

    ToolSummary:
      $ref: '#/components/schemas/CapabilitiesTool'

    ToolListResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ToolSummary'
        total:
          type: integer

    InboxResponse:
      type: object
      additionalProperties: false
      required: [pending_actions, active_runs, recent_terminal_runs, system]
      properties:
        pending_actions:
          type: array
          items:
            $ref: '#/components/schemas/PendingActionSummary'
        active_runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        recent_terminal_runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        system:
          $ref: '#/components/schemas/SystemStatus'

    RunSummary:
      type: object
      additionalProperties: false
      required: [run_id, thread_id, thread_title, status, preview, last_event_label, attention_level, duration_ms, created_at, updated_at]
      properties:
        run_id:
          type: string
        thread_id:
          type: string
        thread_title:
          type: string
        status:
          type: string
          enum: [running, completed, interrupted, failed]
        preview:
          type: string
        last_event_label:
          type: string
        attention_level:
          type: string
          enum: [normal, needs_action, failed, running]
        duration_ms:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PendingActionSummary:
      type: object
      additionalProperties: false
      required: [action_id, run_id, thread_id, kind, status, title, options, created_at]
      properties:
        action_id:
          type: string
        run_id:
          type: string
        thread_id:
          type: string
        kind:
          type: string
          enum: [elicitation, operator_question, tool_approval]
        status:
          type: string
          enum: [pending]
        title:
          type: string
        body:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/PendingActionOption'
        created_at:
          type: string
          format: date-time
        tool_name:
          type: string
          description: Set on tool approvals; the tool waiting to run.
        tool_summary:
          type: string
          description: Set on tool approvals; what the call is about, taken from its arguments, e.g. a URL or a search query.
        allow_freeform:
          type: boolean
          description: Set on operator questions that take a typed answer, sent as `answer` with decision `answer`.

    PendingActionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string

    PendingActionListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingActionSummary'

    PendingActionDetail:
      allOf:
        - $ref: '#/components/schemas/PendingActionSummary'
        - type: object
          additionalProperties: false
          required: [payload]
          properties:
            payload:
              type: object
              additionalProperties: true
            reason:
              type: string
            rule:
              type: string
            tool_detail:
              type: string
              description: Set on tool approvals whose summary cannot hold what the call acts on; the SKILL.md and files a skill_write or skill_import would store.

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    RunArtifact:
      type: object
      additionalProperties: false
      required: [artifact_id, run_id, kind, size_bytes, sha256, created_at]
      properties:
        artifact_id:
          type: string
        run_id:
          type: string
        session_id:
          type: string
        source_tool_result_ref:
          type: string
        kind:
          type: string
          enum: [text, markdown, json, diff, log, test_report, binary]
        title:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
        created_at:
          type: string
          format: date-time

    Thread:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at, state]
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        latest_run_id:
          type: string
        state:
          type: string
          enum: [new, running, completed, failed, interrupted, degraded]
        preview:
          type: string
          description: The latest owner or assistant message, flattened to one line of at most 120 characters.
        preview_role:
          type: string
          enum: [user, assistant]

    ThreadListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Thread'

    CreateThreadRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string

    UpdateThreadRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string

    MessageContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string

    DecidePendingActionRequest:
      type: object
      description: Tool approvals and elicitations send accept or decline. Operator questions send answer with selected_option_id or a freeform answer, or decline with neither.
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accept, decline, answer]
        selected_option_id:
          type: string
        answer:
          type: string

    PendingActionDecision:
      type: object
      additionalProperties: false
      required: [action_id, run_id, status, decision]
      properties:
        action_id:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum: [approved, rejected]
        decision:
          type: string
          enum: [accept, decline, answer]
        selected_option_id:
          type: string
        answer:
          type: string
        decided_at:
          type: string
          format: date-time

    Message:
      type: object
      additionalProperties: false
      required: [id, thread_id, role, content, created_at]
      properties:
        id:
          type: string
        thread_id:
          type: string
        role:
          type: string
          enum: [user, wake, capture, assistant, system, tool]
          description: |
            `wake` is the input of a run started by one of the agent's
            commitments, not something the owner wrote. `capture` is the
            input of a run started by something the owner shared from their
            phone.
        content:
          $ref: '#/components/schemas/MessageContent'
        created_at:
          type: string
          format: date-time
        run_id:
          type: string
        steps:
          type: array
          description: Tool calls the run behind an assistant message made, in the order they started.
          items:
            $ref: '#/components/schemas/ToolStep'
        files:
          type: array
          description: |
            Files an owner message sent, or files the run behind an assistant
            message sent the owner, oldest first. A run that sent files or
            showed views but has no stored reply, because it failed, was
            stopped or is still going, is listed right after its input as an
            assistant message with empty text whose id is the run id.
          items:
            $ref: '#/components/schemas/ThreadFile'
        views:
          type: array
          description: Views the run behind an assistant message showed the owner, oldest first.
          items:
            $ref: '#/components/schemas/View'

    ThreadFile:
      type: object
      additionalProperties: false
      required: [id, name, mime_type, size_bytes, origin, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        origin:
          type: string
          enum: [owner, agent]
          description: '`owner` for a file the owner sent, `agent` for one the agent sent with `send_file`.'
        created_at:
          type: string
          format: date-time

    ThreadFileUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    ToolStep:
      type: object
      additionalProperties: false
      required: [tool_name, outcome]
      properties:
        tool_name:
          type: string
        summary:
          type: string
          description: What the call was about, taken from its arguments, e.g. a search query or a note path.
        outcome:
          type: string
          enum: [running, succeeded, failed]
        error:
          type: string

    MessageListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          $ref: '#/components/schemas/MessageContent'

    CreateRunRequest:
      type: object
      additionalProperties: false
      properties:
        skill_id:
          type: string
        input:
          type: string
          description: >-
            Optional run input. When set, the run records it as the pending user
            message in one step, so a separate POST /messages is not required.
        file_ids:
          type: array
          maxItems: 10
          description: >-
            Files uploaded to the thread that the message sends. With files,
            the message is recorded even when input is empty.
          items:
            type: string

    Run:
      type: object
      additionalProperties: false
      required: [id, thread_id, status, created_at]
      properties:
        id:
          type: string
        thread_id:
          type: string
        status:
          type: string
          enum: [running, completed, interrupted, failed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    RunEvent:
      oneOf:
        - $ref: '#/components/schemas/ClientRunStartedEvent'
        - $ref: '#/components/schemas/ClientAssistantDeltaEvent'
        - $ref: '#/components/schemas/ClientRunCompletedEvent'
        - $ref: '#/components/schemas/ClientRunFailedEvent'
        - $ref: '#/components/schemas/ClientRunInterruptedEvent'
        - $ref: '#/components/schemas/ClientRunResumeRequestedEvent'
        - $ref: '#/components/schemas/ClientElicitationPendingEvent'
        - $ref: '#/components/schemas/ClientElicitationDecidedEvent'
        - $ref: '#/components/schemas/ClientOperatorQuestionPendingEvent'
        - $ref: '#/components/schemas/ClientOperatorQuestionDecidedEvent'
        - $ref: '#/components/schemas/ClientToolApprovalPendingEvent'
        - $ref: '#/components/schemas/ClientToolApprovalDecidedEvent'
        - $ref: '#/components/schemas/ClientToolCallStartedEvent'
        - $ref: '#/components/schemas/ClientToolCallSucceededEvent'
        - $ref: '#/components/schemas/ClientToolCallFailedEvent'
        - $ref: '#/components/schemas/ClientViewShownEvent'
        - $ref: '#/components/schemas/ClientViewUpdatedEvent'
      discriminator:
        propertyName: type
        mapping:
          run.started: '#/components/schemas/ClientRunStartedEvent'
          assistant.delta: '#/components/schemas/ClientAssistantDeltaEvent'
          run.completed: '#/components/schemas/ClientRunCompletedEvent'
          run.failed: '#/components/schemas/ClientRunFailedEvent'
          run.interrupted: '#/components/schemas/ClientRunInterruptedEvent'
          run.resume_requested: '#/components/schemas/ClientRunResumeRequestedEvent'
          elicitation.pending: '#/components/schemas/ClientElicitationPendingEvent'
          elicitation.decided: '#/components/schemas/ClientElicitationDecidedEvent'
          operator_question.pending: '#/components/schemas/ClientOperatorQuestionPendingEvent'
          operator_question.decided: '#/components/schemas/ClientOperatorQuestionDecidedEvent'
          tool_approval.pending: '#/components/schemas/ClientToolApprovalPendingEvent'
          tool_approval.decided: '#/components/schemas/ClientToolApprovalDecidedEvent'
          tool.call.started: '#/components/schemas/ClientToolCallStartedEvent'
          tool.call.succeeded: '#/components/schemas/ClientToolCallSucceededEvent'
          tool.call.failed: '#/components/schemas/ClientToolCallFailedEvent'
          view.shown: '#/components/schemas/ClientViewShownEvent'
          view.updated: '#/components/schemas/ClientViewUpdatedEvent'

    RunEventBase:
      type: object
      additionalProperties: false
      required: [event_id, run_id, seq, ts, type]
      properties:
        event_id:
          type: string
        run_id:
          type: string
        seq:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        type:
          type: string

    ClientRunStartedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.started
            data:
              $ref: '#/components/schemas/RunStartedData'

    ClientAssistantDeltaEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: assistant.delta
            data:
              $ref: '#/components/schemas/AssistantDeltaData'

    ClientRunCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.completed
            data:
              $ref: '#/components/schemas/RunCompletedData'

    ClientRunFailedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.failed
            data:
              $ref: '#/components/schemas/RunFailedData'

    ClientRunInterruptedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.interrupted
            data:
              $ref: '#/components/schemas/RunInterruptedData'

    ClientRunResumeRequestedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: run.resume_requested
            data:
              $ref: '#/components/schemas/RunResumeRequestedData'

    ClientElicitationPendingEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: elicitation.pending
            data:
              $ref: '#/components/schemas/ElicitationData'

    ClientElicitationDecidedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: elicitation.decided
            data:
              $ref: '#/components/schemas/ElicitationData'

    ClientOperatorQuestionPendingEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: operator_question.pending
            data:
              $ref: '#/components/schemas/OperatorQuestionData'

    ClientOperatorQuestionDecidedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: operator_question.decided
            data:
              $ref: '#/components/schemas/OperatorQuestionData'

    ClientToolApprovalPendingEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: tool_approval.pending
            data:
              $ref: '#/components/schemas/ToolApprovalData'

    ClientToolApprovalDecidedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: tool_approval.decided
            data:
              $ref: '#/components/schemas/ToolApprovalData'

    ClientToolCallStartedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: tool.call.started
            data:
              $ref: '#/components/schemas/ToolCallData'

    ClientToolCallSucceededEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: tool.call.succeeded
            data:
              $ref: '#/components/schemas/ToolCallData'

    ClientToolCallFailedEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: tool.call.failed
            data:
              $ref: '#/components/schemas/ToolCallData'

    ClientViewShownEvent:
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: view.shown
            data:
              $ref: '#/components/schemas/ViewShownData'

    ClientViewUpdatedEvent:
      description: A run replaced the content of a view shown earlier in the thread; `data.view` is the view as it now is.
      allOf:
        - $ref: '#/components/schemas/RunEventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: view.updated
            data:
              $ref: '#/components/schemas/ViewShownData'

    RunStartedData:
      type: object
      additionalProperties: false
      properties:
        input:
          type: string

    AssistantDeltaData:
      type: object
      additionalProperties: false
      required: [assistant_delta]
      properties:
        assistant_delta:
          $ref: '#/components/schemas/RunEventAssistantDelta'

    RunCompletedData:
      type: object
      additionalProperties: false
      properties:
        message:
          $ref: '#/components/schemas/RunEventMessage'

    RunFailedData:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string

    RunInterruptedData:
      type: object
      additionalProperties: false
      properties:
        interrupt:
          $ref: '#/components/schemas/RunEventInterrupt'

    RunResumeRequestedData:
      type: object
      additionalProperties: false
      properties:
        targets:
          type: object
          additionalProperties: true

    ElicitationData:
      type: object
      additionalProperties: false
      required: [action_id]
      properties:
        action_id:
          type: string
        message:
          type: string
        requested_schema:
          description: MCP elicitation requested schema

    OperatorQuestionData:
      type: object
      additionalProperties: false
      required: [action_id]
      properties:
        action_id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/PendingActionOption'
        allow_freeform:
          type: boolean
        decision:
          type: string
          enum: [answer, decline]
        selected_option_id:
          type: string
        answer:
          type: string

    PhoneNotificationBatch:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PhoneNotificationInput'
    PhoneNotificationInput:
      type: object
      additionalProperties: false
      required: [key, package, app, posted_at]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 256
          description: Android notification key; limited to 256 UTF-8 bytes.
        package:
          type: string
          minLength: 1
          maxLength: 256
        app:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          maxLength: 200
          default: ''
        text:
          type: string
          maxLength: 2000
          default: ''
        posted_at:
          type: string
          format: date-time
          description: Notification time, at most five minutes ahead of the server.
    PhoneNotificationAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Number of newly inserted entries.

    PushInstallationRequest:
      type: object
      additionalProperties: false
      required: [fid]
      properties:
        fid:
          type: string
          pattern: '^[cdef][A-Za-z0-9_-]{21}$'
          description: Firebase installation ID the app registered with FCM.

    CaptureRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 16384
          description: Shared text, often a link, plus the owner's note.
        subject:
          type: string
          description: Title the sharing app gave, such as a page title.
        image:
          type: string
          format: binary
          description: JPEG, PNG, WebP or GIF, at most 10 MiB.

    CaptureAccepted:
      type: object
      additionalProperties: false
      required: [thread_id, run_id]
      properties:
        thread_id:
          type: string
        run_id:
          type: string

    BrowserTab:
      type: object
      required: [id, title, url]
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
    BrowserTabListResponse:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/BrowserTab'
    BrowserFrame:
      type: object
      required: [jpeg, width, height]
      properties:
        jpeg:
          type: string
          description: Base64 JPEG of what the screen shows.
        width:
          type: integer
          description: Width of the screen in the units taps and scrolls use.
        height:
          type: integer
          description: Height of the screen in the units taps and scrolls use.
    BrowserInputRequest:
      type: object
      required: [tab, type]
      properties:
        tab:
          type: string
        type:
          type: string
          enum: [tap, scroll, down, move, up, text, key, navigate, back, reload]
          description: >-
            `down`, `move` and `up` drag on the page: the left mouse button
            presses where the finger went down, follows its points with the
            button held and releases where it lifted. Each is its own request,
            sent in order and one at a time; a `down` while a drag lost its
            `up` releases that drag first.
        x:
          type: number
          format: double
          description: x of a point in a frame, for tap, scroll, down and up.
        y:
          type: number
          format: double
          description: y of a point in a frame, for tap, scroll, down and up.
        t:
          type: integer
          format: int64
          minimum: 0
          description: For up, milliseconds from the finger going down to it lifting.
        points:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BrowserDragPoint'
          description: >-
            For move, every point the finger passed since the previous move, in
            time order.
        dy:
          type: number
          format: double
          description: Scroll distance in a frame's units; positive scrolls down.
        text:
          type: string
          description: Text to type into the focused field.
        key:
          type: string
          enum: [Enter, Backspace, Tab, Escape, ArrowUp, ArrowDown, ArrowLeft, ArrowRight]
        url:
          type: string
          description: http(s) URL to open, for navigate.
    BrowserDragPoint:
      type: object
      required: [x, y, t]
      properties:
        x:
          type: number
          format: double
          description: x of the point in a frame.
        y:
          type: number
          format: double
          description: y of the point in a frame.
        t:
          type: integer
          format: int64
          minimum: 0
          description: Milliseconds from the finger going down to it being here.
    NowResponse:
      type: object
      additionalProperties: false
      required: [panels, commitments, concerns, watches]
      properties:
        briefing:
          $ref: '#/components/schemas/NowBriefing'
        panels:
          type: array
          description: Views the owner pinned, in the order they were pinned.
          items:
            $ref: '#/components/schemas/NowPanel'
        commitments:
          type: array
          items:
            $ref: '#/components/schemas/NowCommitment'
        concerns:
          type: array
          items:
            $ref: '#/components/schemas/NowConcern'
        watches:
          type: array
          items:
            $ref: '#/components/schemas/NowWatch'

    NowPanel:
      type: object
      additionalProperties: false
      description: A view pinned to the now page, with the conversation it belongs to.
      required: [thread_id, thread_title, view, updated_at]
      properties:
        thread_id:
          type: string
        thread_title:
          type: string
        view:
          $ref: '#/components/schemas/View'
        updated_at:
          type: string
          format: date-time
          description: When the view's content last changed, by the agent or its trigger.

    NowBriefing:
      type: object
      additionalProperties: false
      description: The reply of the newest succeeded morning briefing run; absent before the first one.
      required: [thread_id, run_id, date, body, finished_at]
      properties:
        thread_id:
          type: string
          description: The Briefings thread the run belongs to.
        run_id:
          type: string
        date:
          type: string
          format: date
          description: The owner-local day the briefing is for.
        body:
          type: string
          description: The briefing in Markdown, one section per `##` heading.
        finished_at:
          type: string
          format: date-time

    NowCommitment:
      type: object
      additionalProperties: false
      required: [id, content, state, wake_at, occurrences]
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        state:
          type: string
          enum: [scheduled, due]
        wake_at:
          type: string
          format: date-time
          description: The next wake; for a due commitment, the wake that is being handled.
        recurrence:
          type: string
          description: 5-field cron in the owner's timezone.
        occurrences:
          type: array
          description: Wakes that have not been completed yet.
          items:
            $ref: '#/components/schemas/NowOccurrence'

    NowOccurrence:
      type: object
      additionalProperties: false
      required: [id, due_at, state]
      properties:
        id:
          type: integer
          format: int64
        due_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [claimed, due]
          description: claimed while the wake is starting, due once its run started and until it is completed.
        run_id:
          type: string

    NowConcern:
      type: object
      additionalProperties: false
      required: [id, thread_id, title, state, reason, updated_at]
      properties:
        id:
          type: string
        thread_id:
          type: string
          description: The conversation the concern was created in; the agent works on it there.
        title:
          type: string
        outcome:
          type: string
          description: What the agent hands to the owner when the concern is done; absent for a concern that only follows something.
        state:
          type: string
          enum: [active, waiting]
        reason:
          type: string
          description: The latest reason, written with the current revision.
        review_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NowWatch:
      type: object
      additionalProperties: false
      required: [id, name, kind, target, mode, status, interval_seconds, next_check_at, failures]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [rss, github, web, web_rendered, trigger]
        target:
          type: string
        mode:
          type: string
          enum: [digest, immediate, news]
        section:
          type: string
          description: The news section of a news watch.
        issue:
          type: boolean
          description: A news watch whose entries are issues read on their pages.
        status:
          type: string
          enum: [active, paused, failing]
        interval_seconds:
          type: integer
          format: int64
        next_check_at:
          type: string
          format: date-time
        last_checked_at:
          type: string
          format: date-time
        last_error:
          type: string
        failures:
          type: integer

    MemorySummary:
      type: object
      additionalProperties: false
      required: [id, kind, content, state, revision, pinned, needs_review, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [fact, insight, thought]
        content:
          type: string
        scope:
          type: string
          description: Conditions under which the memory applies.
        state:
          type: string
          description: current, disputed, superseded or retracted for facts and insights; open, resolved or released for thoughts.
        revision:
          type: integer
          format: int64
        pinned:
          type: boolean
          description: The owner explicitly asked Acorn to remember it.
        needs_review:
          type: boolean
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemoryListResponse:
      type: object
      additionalProperties: false
      required: [memories, has_more]
      properties:
        memories:
          type: array
          items:
            $ref: '#/components/schemas/MemorySummary'
        has_more:
          type: boolean
          description: More memories match than the limit returned.

    MemoryEvidence:
      type: object
      additionalProperties: false
      required: [quote, relation, source_kind, speaker, recorded_at]
      properties:
        quote:
          type: string
        relation:
          type: string
          enum: [supports, contradicts]
        source_kind:
          type: string
          description: message, knowledge, event (a tool result), watch, trigger (an event a skill package's trigger reported), thought, or request (the owner's own wording in the app).
        speaker:
          type: string
          description: owner, assistant, tool or external.
        recorded_at:
          type: string
          format: date-time
        thread_id:
          type: string
          description: The conversation the source belongs to, when it has one.
        note_path:
          type: string
          description: Set on knowledge sources.
        tool_name:
          type: string
          description: Set on tool results.

    MemoryEarlier:
      type: object
      additionalProperties: false
      required: [content, updated_at]
      properties:
        content:
          type: string
        updated_at:
          type: string
          format: date-time

    MemoryDetail:
      type: object
      additionalProperties: false
      required: [memory, evidence, based_on, earlier]
      properties:
        memory:
          $ref: '#/components/schemas/MemorySummary'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/MemoryEvidence'
        based_on:
          type: array
          items:
            $ref: '#/components/schemas/MemorySummary'
        earlier:
          type: array
          items:
            $ref: '#/components/schemas/MemoryEarlier'

    MemoryForgetResponse:
      type: object
      additionalProperties: false
      required: [forgotten_ids]
      properties:
        forgotten_ids:
          type: array
          description: Every memory excluded, the requested one and those drawn from what it rests on.
          items:
            type: string

    CorrectMemoryRequest:
      type: object
      additionalProperties: false
      required: [revision, content]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        content:
          type: string
          minLength: 1

    Persona:
      type: object
      additionalProperties: false
      required: [revision, content, sha256, author, saved_at]
      properties:
        revision:
          type: integer
          format: int64
        content:
          type: string
        sha256:
          type: string
        author:
          type: string
          enum: [owner, release]
        device_id:
          type: string
          description: The device the owner saved it from; absent for the release and the server CLI.
        saved_at:
          type: string
          format: date-time

    PersonaRevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, sha256, author, saved_at]
      properties:
        revision:
          type: integer
          format: int64
        sha256:
          type: string
        author:
          type: string
          enum: [owner, release]
        device_id:
          type: string
        saved_at:
          type: string
          format: date-time

    PersonaRevisionListResponse:
      type: object
      additionalProperties: false
      required: [revisions]
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/PersonaRevisionSummary'

    SavePersonaRequest:
      type: object
      additionalProperties: false
      required: [content, base_revision]
      properties:
        content:
          type: string
          minLength: 1
          description: At most 8 KiB of UTF-8 once trimmed.
        base_revision:
          type: integer
          format: int64
          minimum: 1

    Owner:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: What Acorn calls the owner; empty when unnamed.
        updated_at:
          type: string
          format: date-time
          description: When the name was last saved; absent when never saved.

    SetOwnerRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
          description: At most 40 characters once trimmed, without line breaks or other control characters. Empty leaves the owner unnamed.

    KnowledgeNoteSummary:
      type: object
      additionalProperties: false
      required: [path, title, tags, snippet, updated_at]
      properties:
        path:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        snippet:
          type: string
        updated_at:
          type: string
          format: date-time

    KnowledgeNoteListResponse:
      type: object
      additionalProperties: false
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeNoteSummary'

    KnowledgeNote:
      type: object
      additionalProperties: false
      required: [path, title, tags, updated_at, body]
      properties:
        path:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        body:
          type: string
          description: Markdown body of the current revision.

    ToolCallData:
      type: object
      additionalProperties: false
      required: [tool_call_id, tool_name]
      properties:
        tool_call_id:
          type: string
        tool_name:
          type: string
        summary:
          type: string
          description: Set on tool.call.started; what the call is about, taken from its arguments.
        error:
          type: string
          description: Set on tool.call.failed; at most 300 characters.

    ViewShownData:
      type: object
      additionalProperties: false
      required: [view]
      properties:
        view:
          $ref: '#/components/schemas/View'

    View:
      type: object
      additionalProperties: false
      required: [id, title, catalog, components, data, created_at]
      description: |
        A view the agent showed the owner under its reply. `components` is
        flat: each has an `id` and a `component` type from the catalog named
        by `catalog`, containers list their children's ids, and the one with
        id `root` is drawn first. A value is either written out or
        `{"path": ...}`, a JSON Pointer into `data`; inside a List's template,
        a path without a leading slash is relative to the item. The backend
        checked every component, path, link and image before storing the
        view, so the app draws it as it is and shows a component type it does
        not know as a placeholder. A Button or ChoicePicker is sent through
        `POST /v1/threads/{thread_id}/views/{view_id}/actions`; `actions`
        lists the ones already sent, which the app shows as chosen. A later
        run may replace the view's content (`view.updated`). `pinned_at` is
        set while the owner keeps the view pinned to the now page.
      properties:
        id:
          type: string
        title:
          type: string
        catalog:
          type: string
          description: The catalog version, `acorn.views.v1`.
        components:
          type: array
          items:
            type: object
            additionalProperties: true
        data:
          type: object
          additionalProperties: true
        source:
          type: string
          description: The package trigger, as skill/trigger, whose `view_data` lines replace `data` while the view is pinned.
        created_at:
          type: string
          format: date-time
        pinned_at:
          type: string
          format: date-time
          description: When the owner pinned the view to the now page; absent when it is not pinned.
        actions:
          type: array
          description: Buttons and choices of the view the owner already sent, oldest first.
          items:
            $ref: '#/components/schemas/ViewActionSent'

    ViewActionSent:
      type: object
      additionalProperties: false
      required: [component_id, scope, created_at]
      properties:
        component_id:
          type: string
        scope:
          type: array
          description: The index of the item in each List the component was drawn for, outermost first; empty outside Lists.
          items:
            type: integer
        selected:
          type: array
          description: The option ids chosen in a ChoicePicker.
          items:
            type: string
        created_at:
          type: string
          format: date-time

    SendViewActionRequest:
      type: object
      additionalProperties: false
      required: [component_id]
      properties:
        component_id:
          type: string
          description: Id of the Button or ChoicePicker.
        scope:
          type: array
          description: The index of the item in each List the component is drawn for, outermost first; leave out outside Lists.
          items:
            type: integer
        selected:
          type: array
          description: The option ids chosen in a ChoicePicker; leave out for a Button.
          items:
            type: string

    ViewActionResponse:
      type: object
      additionalProperties: false
      required: [run, text, view]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        text:
          type: string
          description: The owner's message the action sent.
        view:
          $ref: '#/components/schemas/View'

    ToolApprovalData:
      type: object
      additionalProperties: false
      required: [action_id]
      properties:
        action_id:
          type: string
        tool_name:
          type: string
        arguments:
          type: string
        decision:
          type: string
          enum: [accept, decline]

    RunDetail:
      type: object
      additionalProperties: false
      required: [run, thread, events, artifacts]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        thread:
          $ref: '#/components/schemas/Thread'
        events:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/RunArtifact'

    InterruptRunResponse:
      type: object
      additionalProperties: false
      required: [run_id, status]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [interrupt_requested]

    RunEventMessage:
      type: object
      additionalProperties: true
      properties:
        role:
          type: string
        content:
          type: string
        reasoning:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/RunEventPlannedToolCall'
        warning_facts:
          type: array
          items:
            $ref: '#/components/schemas/RunEventMessageWarningFact'
        tool_call_id:
          type: string
        tool_name:
          type: string
        meta:
          type: object
          additionalProperties: true

    RunEventAssistantDelta:
      type: object
      additionalProperties: false
      required: [sequence]
      properties:
        role:
          type: string
        delta:
          type: string
        reasoning:
          type: string
          description: Model thinking/reasoning content for reasoning-capable models
        sequence:
          type: integer
        message_id:
          type: string
        is_final:
          type: boolean
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/RunEventPlannedToolCall'
        meta:
          type: object
          additionalProperties: true

    RunEventPlannedToolCall:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        arguments_json:
          type: string

    RunEventMessageWarningFact:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [file_collision, directory_overlap, unknown_scope]
        actor_ids:
          type: array
          items:
            type: string
        tool_names:
          type: array
          items:
            type: string
        paths:
          type: array
          items:
            type: string
        reason:
          type: string

    RunEventInterruptContext:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        address:
          type: string
        info:
          type: object
          additionalProperties: true
        is_root_cause:
          type: boolean

    RunEventInterrupt:
      type: object
      additionalProperties: false
      properties:
        context_count:
          type: integer
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/RunEventInterruptContext'

    # --- Stream payload schemas ---

    ValidationError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
