              value:
                error:
                  code: invalid_pairing_code
                  message: invalid pairing code
    DeviceNotFound:
      description: Device not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            deviceNotFound:
              value:
                error:
                  code: device_not_found
                  message: device not found
    InvalidPushProvider:
      description: Push provider is not supported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidPushProvider:
              value:
                error:
                  code: invalid_push_provider
                  message: invalid push provider
    DevicePushTokenForbidden:
      description: Authenticated device cannot mutate another device's push token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            devicePushTokenForbidden:
              value:
                error:
                  code: device_push_token_forbidden
                  message: device push token belongs to another device
    DevicePushTokenNotFound:
      description: Device push token not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            devicePushTokenNotFound:
              value:
                error:
                  code: device_push_token_not_found
                  message: device push token not found
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRequest:
              value:
                error:
                  code: invalid_request
                  message: content is required
    ThreadNotFound:
      description: Client thread not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            threadNotFound:
              value:
                error:
                  code: thread_not_found
                  message: session thread_123 not found
    RunNotFound:
      description: Run not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            runNotFound:
              value:
                error:
                  code: run_not_found
                  message: run run_123 not found
    RunNotResumable:
      description: Run exists but cannot be resumed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            runNotResumable:
              value:
                error:
                  code: run_not_resumable
                  message: run run_123 is not interrupted
    RunNotActive:
      description: Run exists but is not currently active
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            runNotActive:
              value:
                error:
                  code: run_not_active
                  message: run not active
    PendingActionNotFound:
      description: Pending action not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            pendingActionNotFound:
              value:
                error:
                  code: pending_action_not_found
                  message: pending action not found
    PendingActionAlreadyDecided:
      description: Pending action has already been decided
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            pendingActionAlreadyDecided:
              value:
                error:
                  code: pending_action_already_decided
                  message: pending action already decided
    InvalidRunEventRequest:
      description: Invalid RunEvent replay request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidAfterSeq:
              value:
                error:
                  code: invalid_after_seq
                  message: after_seq must be a non-negative integer
            invalidFollow:
              value:
                error:
                  code: invalid_request
                  message: follow must be a boolean
    RunEventProjectionFailed:
      description: Persisted live run event could not be projected into RunEvent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            projectionFailed:
              value:
                error:
                  code: run_event_projection_failed
                  message: client projection failed
    SettingsWriteUnsupported:
      description: Client settings write path is explicitly unsupported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            settingsWriteUnsupported:
              value:
                error:
                  code: settings_write_unsupported
                  message: client settings write endpoint is not implemented
    FactNotFound:
      description: Memory fact not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            factNotFound:
              value:
                error:
                  code: fact_not_found
                  message: fact not found
    SkillNotFound:
      description: Skill not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            skillNotFound:
              value:
                error:
                  code: skill_not_found
                  message: skill inspect-repo not found
    ExecutionNotReady:
      description: Execution paths are unavailable because required model/runtime config is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            executionNotReady:
              value:
                error:
                  code: execution_not_ready
                  message: 'execution not ready: model.api_key is required'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                error:
                  code: internal_error
                  message: internal server error

