      type: object
      additionalProperties: false
      required: [name, model, enabled]
      properties:
        name:
          type: string
        model:
          type: string
        base_url:
          type: string
        timeout_seconds:
          type: integer
        temperature:
          type: number
          format: float
        max_completion_tokens:
          type: integer
        reasoning_effort:
          type: string
          enum: [low, medium, high]
          description: Controls reasoning model effort (low=fastest, medium=default, high=most thorough). Only used by reasoning-capable models (o1, o3, etc.).
        extra_fields:
          type: object
          additionalProperties: true
          description: Provider-specific extra body fields added to the top-level of the API request. Useful for vendor-specific features not covered by standard fields. Examples — Claude thinking mode (nested object with 'type' and 'budget_tokens'), or other provider extensions. Fields must match the provider API schema exactly.
